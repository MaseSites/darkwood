<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>traidingBrain — awaiting decision</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23060910'/><path d='M3 11h10M8 3v8' stroke='%23f59e0b' stroke-width='1.5'/></svg>"
    />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <h1 class="wordmark">traidingBrain <span>/ awaiting decision</span></h1>
        <div class="status-strip" id="strip"><span class="pulse"></span></div>
      </header>

      <div id="banners"></div>

      <!-- The market, always. Most hours have no setup, and a screen only worth
           opening when one appears is a screen nobody learns the market on. -->
      <section class="market" id="market" aria-label="Market view">
        <div class="placeholder"><span class="pulse"></span><p>Reading the market&hellip;</p></div>
      </section>

      <!-- The proposals. One screen, no scrolling into view: everything that
           matters for a decision should be visible at the moment it is made. -->
      <main class="stack" id="list" aria-live="polite">
        <div class="placeholder"><span class="pulse"></span><p>Loading&hellip;</p></div>
      </main>

      <footer class="footnote">
        <span>
          Nothing is sent without a held confirmation. The engine proposes; the
          decision is yours.
        </span>
        <button class="btn" type="button" id="halt">Halt / resume trading</button>
      </footer>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
