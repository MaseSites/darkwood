# Engine configuration.
#
# Secrets never live here -- they come from .env via pydantic-settings. This file
# is committed; .env is not.

exchange:
  # bybit or binance. This is read -- for a long time it was not, and `ccxt.bybit`
  # was built directly in two places while this line sat here describing a choice
  # the code did not offer. data/venue.py is now the only place that knows.
  #
  # Both were re-checked from this machine: Binance USD-M and its futures testnet
  # both answer, and ccxt serves candles, funding, open interest and the
  # long/short ratio through unified methods on either. The original note said
  # testnet.binancefuture.com did not resolve; that is no longer true.
  name: binance
  market_type: linear      # USDT perpetuals
  testnet: true            # the only sane setting before stage 10
  rate_limit_ms: 120

symbols:
  # All four are followed now. The single-symbol phase was for validating the
  # engine cheaply; the comparison runs have since been done on all four, and a
  # screen that offers one asset to look at is a screen with nothing to choose.
  #
  # Only the analysis runs on all of them -- the model is still asked per asset,
  # on demand, so this costs bars and CPU rather than money.
  # All twelve. The rules fired 1.9 times a day across four markets and Severin
  # wants ten; this is the lever that gets most of the way there without making
  # a single rule more generous -- the same setups, the same cadence, read off
  # three times as many charts. It needed no measurement for exactly that
  # reason: nothing about how a trade is decided changes.
  active:
    [
      BTCUSDT,
      ETHUSDT,
      SOLUSDT,
      XRPUSDT,
      ADAUSDT,
      AVAXUSDT,
      LINKUSDT,
      DOGEUSDT,
      BNBUSDT,
      LTCUSDT,
      DOTUSDT,
      ATOMUSDT,
    ]

  # `available` is "we have the data and could trade it"; `active` is "we do".
  # The eight below were added to raise the number of cases: the rules fire
  # about 1.9 times a day across four markets, and Severin wants ten. More
  # markets is the one lever that gets there without making a single rule more
  # generous -- the same setups, read off more charts.
  #
  # What it does not buy, and the reason the two lists stay separate: crypto
  # moves largely as a block, so twelve markets give roughly three times the
  # trades and much less than three times the independent evidence. On a bad
  # day they all lose together. More cases, not proportionally more proof.
  #
  # All eight carry six to seven years of history and a minimum order size of
  # 5 to 20 USDT -- small enough that a five-franc risk budget still produces a
  # placeable position, which is already not quite true of BTC.
  available:
    [
      BTCUSDT,
      ETHUSDT,
      SOLUSDT,
      XRPUSDT,
      ADAUSDT,
      AVAXUSDT,
      LINKUSDT,
      DOGEUSDT,
      BNBUSDT,
      LTCUSDT,
      DOTUSDT,
      ATOMUSDT,
    ]

# Which of the guide's setups may trade. Leaving one out does not delete it --
# it keeps its tests, its rule card and its row in every comparison.
setups:
  enabled: [A, B, E, F, G]
  # Die zwei Regeln vom 21.10.2026 -- "mache das, was die Gewinner gemeinsam
  # hatten", auf Anweisung des Eigentuemers, nachdem das Plankonto 26 Trades
  # auf -9.34 R / -175 USD stand. Gewinner gegen Verlierer wurden ueber
  # jedes Vor-Trade-Merkmal geschnitten und jede Differenz gegen das Replay
  # (7'335 Trades, zwoelf Maerkte) UND gegen 39'075 Trades auf 56 ungesehenen
  # Maerkten gehalten. Nur zwei Merkmale zeigen in allen drei Stichproben in
  # dieselbe Richtung; der Rest (Widerspruch, Rating, Regime, Seite, Stunde,
  # Markt) war Rauschen einer Nacht.
  #
  #   M15-Setup      live 33 % / -0.27 R   Replay 35 % / -0.037   ungesehen 34.6 % / -0.064
  #   H1 und hoeher  live 48 % / +0.25 R   Replay 38 % / +0.01    ungesehen 37.9 % / +0.001
  #   gegen das Bild live 28 % / -0.38 R   Replay 32 % / -0.054   ungesehen 32.4 % / -0.072
  #   mit dem Bild   live 44 % / +0.07 R   Replay 38 % / -0.002   ungesehen 37.4 % / -0.019
  #   beides (H1+ und mit Bild), ungesehen: 38.9 % Treffer, +0.0024 R, n=17'213
  #
  # WAS DAS IST: das Weglassen der gemessen schlechtesten Population. WAS ES
  # NICHT IST: ein Vorteil. Die beste Zelle liegt out-of-sample bei +0.002 R,
  # also Break-even, mit 39 % Treffern. Rund die Haelfte der bisherigen
  # Trades faellt weg (M15 war 48 % der Trades, "gegen" 22 %).
  # Beides steht in der Laufsignatur (|tf=D1,H4,H1|bild), Epochen bleiben
  # trennbar. Rueckgaengig: die zwei Zeilen loeschen und neu starten.
  timeframes: [D1, H4, H1]
  require_agreement: true
  disabled_note: >-
    C ist am 04.10.2026 abgeschaltet worden. Gemessen ueber vier Maerkte und
    vier Jahre: mit C laeuft der Pool auf -0.0920 R und das Intervall
    schliesst die Null aus; ohne C auf -0.0583 R bei einem Drittel weniger
    Trades, Trefferquote 32 auf 37 Prozent, und das Intervall enthaelt zum
    ersten Mal die Null. Mehr als die Haelfte des Gesamtverlusts kommt aus
    diesem einen Setup. Rueckgaengig: C wieder in die Liste oben.

timeframes:
  # W1 and D1 give the macro read, H4 the intermediate structure, H1 the setup,
  # M15 the entry timing. M1 is not analysed -- it exists so the simulator can tell
  # whether stop or target was hit first inside an H1 candle. Without it, every
  # backtest has to guess, and guessing optimistically is how a strategy looks
  # profitable on paper and is not.
  context: [W1, D1, H4, H1, M15]
  # The loop decides once per signal candle. At H1 that meant the fifteen-minute
  # chart finished four candles an hour and seventy-two of its ninety-six a day
  # were never examined -- a setup that formed at 08:15 and completed by 08:45
  # was never offered, because nobody looked until 09:00.
  #
  # Severin asked for this directly ("du kannst doch auch in 15 Minuten Trades
  # machen") and it is a defect rather than a preference: it makes no rule more
  # generous, it reads the chart as often as the chart changes. Measured on BTC
  # and ETH it is worth 31-41% more trades; what it costs is still being
  # measured by study_cadence.py, and the journal records the cadence per trade
  # so the two eras can be told apart afterwards.
  signal: M15
  execution: M1

indicators:
  atr_period: 14
  rsi_period: 14
  ema_fast: 21
  ema_slow: 55
  macd: { fast: 12, slow: 26, signal: 9 }
  bb: { period: 20, std: 2.0 }
  volume_ma: 20

structure:
  # A swing needs this many bars on each side before it counts. The right-hand
  # bars are why a swing is only knowable in arrears -- structure objects record
  # the bar that confirmed them, never the bar that formed them.
  swing_lookback: 3
  max_sequence_length: 6

liquidity:
  equal_level_tolerance_atr: 0.15
  # How long a sweep stays relevant, in bars. Counted in bars rather than hours
  # on purpose: twelve bars is three hours on M15 and three months on W1, and in
  # both cases that is roughly how long the market remembers a stop hunt on that
  # timeframe. At 50 the weekly frame reports a sweep from a year ago as current.
  sweep_lookback_bars: 12
  fvg_min_size_atr: 0.25

regime:
  # Volatility buckets are rolling percentiles over this window. Never global:
  # a percentile computed over the whole dataset puts the future into every
  # snapshot.
  volatility_window: 200
  # Bars used to measure trend slope. The same number on every timeframe, which is
  # the point: 50 bars is two days on H1 and about a year on W1, and those are the
  # right horizons for "short-term direction" and "macro direction" respectively.
  # At 100 the weekly frame needs two years of history before it says anything,
  # which costs more backtest window than the extra smoothing is worth.
  trend_window: 50

history:
  # A lookup returns at most this many neighbours, and deduplication only removes
  # some, so this has to sit well above min_samples_for_stats below. It did not:
  # 25 against a threshold of 30 made the threshold unreachable, and every one of
  # seventy-one thousand lookups reported "not enough" while looking exactly like
  # a shortage of data. settings.py now refuses that combination outright.
  k_neighbours: 120
  # Outcome horizon. A neighbour from within this window of the current bar has an
  # outcome that overlaps the present, so it is excluded (purging + embargo).
  outcome_horizon_hours: 48
  embargo_hours: 48
  # Independent comparable cases needed before a win rate may be quoted.
  #
  # A win rate from six cases is three wins. Below this the honest answer is that
  # there is no rate, not a noisy one -- so while it is unmet every lookup reports
  # "not enough", confidence stays capped, and no trade may risk more than the
  # base tier. That is the design working, not a reason to lower this number.
  #
  # Whether it is *met* depends on how many resolved cases the index holds and how
  # many of them fall inside the distance cutoff in history/stats.py. Four symbols
  # over the current window produce about 250 cases in total, which is not enough;
  # a longer window is the fix, not a smaller threshold.
  min_samples_for_stats: 30

brain:
  model: claude-opus-5-5
  # Prompt iteration runs on the cheaper model; the measured run does not mix them,
  # because caches are scoped per model.
  iteration_model: claude-sonnet-5-5
  effort: medium            # default on Opus 5.5; raise only if measurement earns it
  max_tokens: 8000
  prompt_version: v1
  # Backtests go through the Batch API: half price, no rate-limit juggling, and a
  # backtest is by definition not latency-sensitive.
  use_batch_api_for_backtest: true
  max_usd_per_backtest: 25.0

trigger:
  # The deterministic gate that decides *when* the model is asked at all. Without
  # it a multi-year backtest costs a fortune to produce mostly "no setup here".
  require_bos_or_choch: true
  require_sweep: false
  min_indicator_confluence: 2
  min_bars_between_calls: 4

simulation:
  # Starting equity per market, in quote currency (USDT).
  #
  # **Je Markt, und seit dem 13.10.2026 nur noch als Baustein.** Im Backtest
  # ist das weiterhin das Startkapital eines Laufs. Im Papierhandel gibt es
  # seitdem EIN Konto, und sein Einsatz ist dieser Betrag mal Zahl der Maerkte
  # -- 12 x 1.000 = 12.000 USDT. `scripts/papertrade.py` bildet daraus beim
  # einmaligen Umschalten die geteilte Kasse, und `api/portfolio.py` leitet
  # daraus den Einsatz her, gegen den die Veraenderung gemessen wird.
  #
  # Hier stand bis zum 14.10.2026 "each of the four markets keeps its own
  # account, so the paper portfolio is four thousand". Zwei Dinge daran waren
  # ueberholt: es sind zwoelf Maerkte, und sie halten keine eigenen Konten
  # mehr.
  #
  # Severin's own number: a thousand is roughly what he expects to have when he
  # starts. It was ten thousand, which made every figure on the screen a size
  # he has never held.
  #
  # Small enough to matter. At 0.5% risk this is five francs a trade, and the
  # venue refuses anything under fifty USDT of notional -- so a setup with a very
  # wide stop can now be too small to place, where at ten thousand it never was.
  # That is a real constraint rather than a bug: it is the one a thousand francs
  # actually imposes, and seeing it here is the point of using the real number.
  initial_equity: 1000.0

  # Slippage applied to fills that cross the spread: market entries, stop exits and
  # liquidations. Limit orders that get filled do not pay it -- they were sitting
  # there waiting.
  #
  # 3 basis points is modest for BTC perpetuals in normal conditions and optimistic
  # in a fast move. It is a parameter rather than a constant precisely because the
  # honest value is only knowable after stage 10 measures real fills.
  slippage_bps: 3.0

  # Whether a limit entry counts as filled the moment price touches it.
  #
  # False is the conservative reading and the default: a touch means the price
  # printed there, not that our order was at the front of the queue. Requiring the
  # price to trade through means fewer fills, and the ones that remain are ones we
  # would plausibly have got.
  fill_on_touch: false

  # How long a pending entry waits before it is abandoned. A setup that has not
  # triggered within this window is a different setup.
  # Counted in signal candles, so the move to M15 would have cut a resting
  # order's life from eight hours to two. That is a different rule, not a
  # different cadence -- thirty-two keeps the same eight hours the measurements
  # were taken under.
  entry_expiry_bars: 32

  # When a single minute contains both the stop and the target, the stop wins.
  # There is no way to know the order from OHLC alone, and guessing in our favour
  # is how a backtest ends up profitable and a live account does not.
  pessimistic_intrabar: true

paths:
  data_dir: data
  parquet_dir: data/ohlcv
  funding_dir: data/funding
  db_path: data/traidingbrain.sqlite
  cache_db_path: data/decisions.sqlite
  runs_dir: runs
