[project]
name = "traidingbrain"
version = "0.1.0"
description = "Trading intelligence engine — Claude as interpretation layer, human confirms every trade"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "ccxt>=4.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
    # Imported by storage/postgres.py since the pool landed. Undeclared, it only
    # works where something else happened to install it -- which is every
    # machine that has run this project before, and none that has not. The
    # Raspberry Pi collector is the first fresh install since, and it failed
    # here.
    "psycopg[pool]>=3.2",
    # Fuer den Streaming-Collector. Version 17.1 war auf dieser Maschine
    # vorhanden, ohne erklaert zu sein -- dieselbe Falle wie bei psycopg
    # darueber, und sie faellt erst auf einer frischen Installation auf. Ein
    # geschuetzter Import waere die falsche Antwort gewesen: er haette den
    # Fehler versteckt statt die Abhaengigkeit benannt.
    "websockets>=13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]
# The proposal store and its migrations. The pool is not optional within this
# group: every store method takes a connection, the dashboard polls one every
# four seconds, and the confirmation path runs a hundred callers at once against
# a server allowing twenty connections.
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "hypothesis>=6.112",
    "syrupy>=4.7",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traidingbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live and not costs_money'"
markers = [
    "live: hits a real network endpoint (deselected by default via -m 'not live')",
    "costs_money: calls the Anthropic API and spends real budget",
    "allow_hosts: permit loopback so an in-process test client can run",
]
filterwarnings = ["error::DeprecationWarning:traidingbrain.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# A test that says `assert len(bars) == 23` is doing its job. Replacing the
# number with a named constant moves the expectation away from the assertion and
# makes the test harder to read, not safer.
"tests/**" = ["PLR2004"]
# Fixture builders import inside the function so that importing `fakes` stays
# cheap for tests that only need the tiny helpers.
"tests/fakes.py" = ["PLR2004", "PLC0415"]
# Scripts insert src/ on the path before importing the package.
"scripts/**" = ["E402"]
# The YouTube research scripts came in with the guide as one-off tooling for
# fetching and curating transcripts. They are kept as they arrived so the
# provenance of the source material stays checkable; their shape is not the
# codebase's to argue with.
"scripts/*youtube*.py" = ["E402", "PLR0912", "PLR0915", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["traidingbrain"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "duckdb.*", "structlog.*", "pyarrow.*"]
ignore_missing_imports = true
