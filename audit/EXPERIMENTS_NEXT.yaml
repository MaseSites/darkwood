        Was sich trotzdem sagen laesst, je Zelle:

        E12.1 Wochenende: neu Sa/So -0.0319 R (n=1488) gegen Mo-Fr +0.0270 R
        (n=5847), Differenz -0.0589 R [-0.2373, +0.1241], Null ENTHALTEN. Das
        Verhaeltnis der Differenzen ist 0.79x und laege damit IM Tor 0.5-2.0.
        Der Effekt hat zwei Konfigurationsaenderungen ueberlebt (Kadenz und
        Setup-Liste), was fuer sich bemerkenswert ist -- aber ein Verhaeltnis,
        das zufaellig im Fenster liegt, ersetzt keine gueltige Replikation.
        Als RICHTUNGSBEFUND das Konsistenteste, was E12 hergegeben hat.
        Wochenendanteil neu 20.3 % gegen 28.6 % Kalender, also weiter
        unterproportional.

        E12.2 Funding-Stunde: Verhaeltnis 0.29x, ausserhalb des Tors, neue
        Differenz -0.0077 R [-0.1646, +0.1497]. Zweimal nichts. GESCHLOSSEN.

        E12.3 Viertelstundenmarke: auf dem neuen Lauf ERSTMALS messbar, weil
        die M15-Kadenz die Besetzung liefert -- :00 n=649 bei +0.0429 R gegen
        15/30/45 n=2821 bei -0.0109 R, 147 Limit-Fills ausgeschlossen.
        Differenz +0.0537 R [-0.1871, +0.2953], Null ENTHALTEN, Rand belegt.
        Der Viertelstunden-Effekt aus Kim/Hansen zeigt sich in unseren Trades
        NICHT als Gruppenunterschied. Sauberes Nein bei richtiger Besetzung,
        nicht mehr "zu klein". Schliesst die Papier-Mechanik nicht aus, die
        Orderfluss-Imbalance braucht und damit ein Trade-Tape.

        Bericht: audit/DER_NEULAUF_7335.md, Abschnitt 3.
      mechanismus_gemessen: >-
        Das System nimmt 18.9 % seiner Trades am Wochenende, wo der Kalender
        28.6 % hergaebe, und der Mechanismus ist exakt bestimmt -- ohne neue
        Messung, nur als Gruppierung des Signalspeichers nach Wochentag.
        47.918 Replay-Zeilen unter der laufenden Signatur, Deckel 0.08:

        Werktag n=34.684: genommen 16.9 %, Kosten-Ablehnung 46.3 %,
        Chance/Risiko 36.8 %, Kostenquote-Median 0.06727, Stopweite-Median
        0.82683 %.

        Wochenende n=13.234: genommen 11.2 %, Kosten-Ablehnung 51.9 %,
        Chance/Risiko 36.8 %, Kostenquote-Median 0.08920, Stopweite-Median
        0.59877 %.

        Die Setups feuern proportional (27.6 % der Signale gegen 28.6 %
        Kalender), das Chance-Risiko-Tor greift IDENTISCH. Der ganze
        Unterschied steckt im Kostentor, dessen Deckel bei 0.08 steht: der
        Wochenend-Median liegt darueber, der Werktags-Median darunter.

        Die Ursache ist eine Identitaet, keine Auslegung: ueber alle 47.918
        Zeilen ist cost_fraction * stop_fraction konstant 0.00105000, die
        Rundenkostenrate. Hoehere Kostenquote heisst also zwingend engerer
        Stop, und die Wochenend-Stopweite ist das 0.724-fache. Geringere
        Wochenend-Vola zieht strukturbasierte Stops zusammen, bis die feste
        Gebuehr den Trade frisst.

        Das Wochenende wird nicht gemieden, weil es gefaehrlich ist, sondern
        weil es teuer ist relativ zur verfuegbaren Bewegung -- dieselbe
        Achse, an der das ganze System haengt.
      was_nicht_gilt: >-
        Das Wochenende weglassen hebt den Mittelwert von -0.0348 auf -0.0207
        R, also um 0.0141 R, und bleibt negativ. Ein Zeitfilter aendert nur,
        welche Trades existieren; ein Hebel, der bloss die Trade-Zahl
        aendert, kann das Vorzeichen nicht drehen.
      kadenz_befund: >-
        Die Frage "warum oeffnen 500 von 542 M15-Trades auf :00" sah nach
        einem Defekt in SEARCH_ORDER aus. Es ist keiner: der alte Lauf laeuft
        auf H1-KADENZ, der heutige auf M15. Bei stuendlicher Entscheidung wird
        der M15-Chart nur zur vollen Stunde befragt, 72 seiner 96 Tageskerzen
        werden nie angesehen. config/settings.yaml beschreibt das als
        behobenen Defekt und steht auf signal: M15; der neue Lauf bestaetigt
        es mit 65 von 88 M15-Einstiegen auf 15/30/45.

        Das ist ein GROESSERER Unterschied als die Setup-Liste, um die es beim
        Replay-Neulauf geht, und keine Zeile in den Daten sagte es. Die
        Replay-Zeilen im Journal tragen keine run_signature; die Kadenz war
        nur aus der Minutenverteilung zu erschliessen. Das Skript markiert
        sie als "H1 (erschlossen)" und verweigert jede Replikation ueber zwei
        Kadenzen. Der Runner schreibt die Kadenz ab Commit 6712704 je Datei
        UND je Eintrag.
  - id: E13
    title: "Der Deckel auf gleichzeitig offene Positionen, auf EINEM Konto"
    priority: 1
    status: gelaufen_kein_befund
    ergebnis_nachgetragen_21_10_2026: >-
      Gelaufen am 14.10. (scripts/study_concurrency.py, 7'335 Replay-Trades,
      Ergebnis im Kommentar zu max_open_positions in config/risk.yaml). Deckel 2
      +0.0099 R/Trade auf 3'109 Trades, Deckel 5 -0.0029 R auf 5'694, kein
      Deckel -0.0129 R auf 7'335. Differenz Deckel 5 gegen keinen Deckel
      [-0.099; +0.125] R, enthaelt die Null. Der Deckel ist eine Schutzregel,
      keine belegte Verbesserung. Status hier war nie gesetzt.
    cells: 8
    comparisons: 4
    arms:
      - id: E13.1
        name: "Deckel 1 bis 12 gegen kein Deckel, Replay-Population aller zwoelf Maerkte"
    auswahlregel_vorab: >-
      floor(max_daily_loss_pct / risk_pct je Trade) = floor(0.05 / 0.010) = 5.

      ARITHMETISCH und ausdruecklich NICHT nach dem R-Ergebnis. Begruendung:
      die Tagesgrenze zaehlt nur REALISIERTE Verluste und kann nicht greifen,
      bevor die Positionen geschlossen sind. Was gleichzeitig offenes Risiko
      begrenzt, ist allein die Zahl der Plaetze, und die passende Zahl ist
      die, bei der ein vollstaendig schiefgelaufener Tag genau die
      Tagesgrenze erreicht.

      Wer den Deckel nach seinem R-Ergebnis waehlt, hat einen Parameter auf
      seine eigene beste Zelle gefittet. Die Zahlen werden berichtet, weil
      ein Deckel einen Preis hat und der Preis sichtbar gehoert -- nicht,
      weil er entscheidet.
    acceptance: >-
      KEINE. Dieser Arm trifft keine Edge-Behauptung und hat darum kein
      Abnahmekriterium. Er misst, was eine Schutzregel kostet. Die vier
      gezaehlten Vergleiche sind trotzdem angemeldet und erhoehen
      `total_comparisons`: lieber eine Korrektur bezahlen, die vielleicht
      nicht geschuldet ist, als ein Register fuehren, in dem Messungen
      verschwinden, weil sie "nur beschreibend" waren. Der Fehler geht in
      die konservative Richtung -- alle kuenftigen Intervalle werden
      geringfuegig breiter.
    status: offen
    angelegt: 2026-10-13
    declared_before_reading: true
    warum_heute: >-
      Bis zum 13.10.2026 fuehrte der Papierhandel zwoelf getrennte Konten,
      und `max_open_positions` galt dort fuer nichts: ein SimBroker hat
      strukturell einen Platz, also konnte KEIN Wert der Einstellung das
      Verhalten aendern. Seit der Umstellung auf eine Kasse sind zwoelf
      Symbole in einem Konto genau der Fall, fuer den die Einstellung
      geschrieben wurde -- und damit steht die Zahl erstmals zur
      Entscheidung.
    grenze_der_messung: >-
      Gegenrechnung erster Ordnung: Ereignisse in Zeitreihenfolge, eine
      Eroeffnung wird abgelehnt, wenn schon `cap` Positionen offen sind.
      Geprueft wird an der FUELLZEIT, der echte Pruefpunkt ist die
      Vorschlagszeit; und eine abgelehnte Eroeffnung veraendert in
      Wirklichkeit auch die spaeteren Belegungen, was nur ein vollstaendiger
      Neulauf abbildet. Richtung des Fehlers bekannt: die Ablehnungsquote
      faellt eher zu niedrig aus als zu hoch.
  - id: E14
    title: "Stop auf Einstand -- die einzige Ausstiegsregel, die nie gemessen wurde"
    priority: 1
    cells: 2
    comparisons: 2
    arms:
      - id: E14.1
        name: "Stop auf Einstand, sobald der Trade +1.0 R vorn lag"
      - id: E14.2
        name: "Stop auf Einstand, sobald der Trade +0.5 R vorn lag"
    was_ich_VORHER_schon_gesehen_habe: >-
      WICHTIG, und es waere unredlich, es zu verschweigen: dieser Arm ist
      NICHT blind angelegt. Er entstand aus einer Auswertung der
      post_mortem-Felder des Journals, die ich vor der Anmeldung gemacht
      habe. Gemessen ueber 2.734 Replay-Trades:

        beste Lage je Trade im Mittel     +1.4964 R
        Ergebnis je Trade im Mittel       -0.0906 R
        Rueckgabe                         +1.5871 R

        erreichten je +1.0 R   1.415 (51.8 %), davon endeten 537 im Minus
        vom Docht gestoppt       966 (35.3 %)
        nie im Plus              192 (7.0 %)

      Was diese Zahlen NICHT sind: ein Ergebnis fuer diesen Arm. Die beste
      Lage ist eine Obergrenze, die nur mit Rueckschau erreichbar ist, und
      JEDES System gibt einen Teil davon zurueck. Sie sagen nur, dass die
      Frage sich lohnt -- die Einstiege finden Bewegung, und zwar reichlich.
      Was sie an Auswahl erzeugen, ist mit angemeldet: die beiden
      Schwellen 1.0 und 0.5 stehen VOR dem Lauf fest und werden nicht
      nachtraeglich um die Zelle erweitert, die am besten aussieht.
    acceptance: >-
      Beide Tore, wie fuer jeden Arm. Korrigiertes Intervall ohne Null auf
      der Differenz zur heutigen Regel (ohne Einstand-Stop), UND Replikation
      0.5-2.0x zwischen der frueheren und der spaeteren Haelfte der
      Stichprobe.

      Primaerkennzahl ist NETTO-R je Trade. Nicht R TOTAL: ein
      Einstand-Stop beendet Trades frueher und gibt damit den naechsten
      Einstieg frei, also unterscheiden sich die Trade-ZAHLEN, und
      `scripts/compare_exits.py` sagt das selbst -- verglichen werden zwei
      verschiedene Mengen, nicht dieselben Trades mit anderen Ausgaengen.
      Eine gepaarte Rechnung ist hier also FALSCH.

      Und der Rand, vorab festgelegt, nach der Lehre aus E10: Anteil unter
      -1R, schlimmster Einzelverlust, 5%-Quantil, sowie der Anteil der
      Gewinner, die der Einstand-Stop abschneidet. Ein besserer Mittelwert
      bei schwererem Rand ist KEIN positives Ergebnis. E10 hat genau das
      geliefert -- besserer Mittelwert, dreifacher schlimmster Verlust --
      und wurde deshalb verworfen.
    warum_ueberhaupt: >-
      Der Simulator kann die Regel seit jeher (`sim/broker.py`,
      `_maybe_move_to_breakeven`, ausgeloest von
      `engine.simulation.breakeven_at_r`). Der Wert steht in KEINER
      Konfigurationsdatei, der Vorgabewert ist None, also ist die Regel
      aus -- und nirgends steht, dass das eine Entscheidung war.

      E3 hat die Ausgaenge geprueft und die heutige Regel bestaetigt, aber
      gegen zwei ANDERE Alternativen: festen 24h-Zeitausstieg (-0.0824 R,
      Richtung negativ) und 2.0-ATR-Trailing (-0.0762 R, zuverlaessig
      schlechter). Der Einstand-Stop war in E3 nicht dabei.
    gegenargument_das_vorher_steht: >-
      Die Regel schneidet nach Konstruktion in beide Richtungen. Sie rettet
      die Trades, die einen Punkt zurueckgaben, und kratzt die, die vor dem
      Lauf noch einmal eintauchten. Die ganze Frage ist, welche der beiden
      Mengen groesser ist, und ein Ergebnis nahe null ist eine echte
      Antwort und keine missglueckte Messung.

      Die naive Obergrenze aus den Zahlen oben -- 537 gerettete Trades mal
      rund 1 R, also +0.196 R je Trade -- ist AUSDRUECKLICH keine
      Vorhersage. Sie zaehlt nur die eine Seite. Die andere Seite ist aus
      dem Journal nicht lesbar, weil post_mortem die beste und die
      schlimmste Lage kennt, aber nicht ihre Reihenfolge; dafuer muss der
      Motor laufen.
    status: gelaufen_gefallen
    gelaufen: 2026-10-18
    ergebnis: >-
      **Gefallen, beide Zellen, beide Tore -- und MONOTON in die falsche
      Richtung.** Zwoelf Maerkte, Zwischenspeicher `data/arms_alle.jsonl`
      (84 Paare), Niveau 99.932 %:

        Basis              n=7335   -0.0129 R  [-0.067, +0.040]
        Einstand bei 1 R   n=8414   -0.0147 R  [-0.057, +0.026]
          Differenz                 -0.0018 R  [-0.069, +0.066]
          Replikation               -2.56x     (frueh +0.0023, spaet -0.0060)
        Einstand bei 0.5 R n=9736   -0.0308 R  [-0.063, +0.002]
          Differenz                 -0.0178 R  [-0.080, +0.045]
          Replikation               +4.27x     (frueh -0.0068, spaet -0.0289)

      Je frueher der Stop nachgezogen wird, desto schlechter das Ergebnis.
      Bei 0.5 R ist der Verlust je Trade 2.4-mal so gross wie in der Basis.
    was_die_regel_tatsaechlich_tut: >-
      **Sie funktioniert -- und schadet trotzdem.** Die vorab verlangten
      Rand-Kennzahlen zeigen es:

        Anteil unter -1 R   Basis 60.3 %   bei 1 R 47.5 %   bei 0.5 R 31.5 %
        Regel feuerte       --             43.9 % von 4166  72.4 % von 6561
        schlimmster Verlust -1.89 R in allen drei Armen
        5 %-Quantil         -1.08 / -1.07 / -1.07 R

      Der Einstand-Stop verhindert also genau das, wofuer er gebaut ist: der
      Anteil der Vollverluste halbiert sich fast. Die geretteten Vollverluste
      werden von abgeschnittenen Gewinnern mehr als aufgewogen, und die
      Rechnung dreht sich umso weiter ins Minus, je mehr Trades die Regel
      erfasst.

      Damit ist der Rueckgabe-Befund (Durchschnittstrade erreicht +1.1840 R
      und endet bei -0.0129 R) nicht mit einem Stop einzufangen. Er ist keine
      Nachlaessigkeit im Ausstieg, sondern beschreibt, wie diese Trades
      verlaufen: sie gehen zuerst ins Plus und kommen zurueck, und wer sie am
      Einstand abschneidet, nimmt die wenigen, die durchlaufen, mit heraus.
    note: >-
      `declared_before_reading` steht auf TRUE und das Ergebnis ist in der
      vorhergesagten Richtung nicht eingetreten -- die Vorab-Erwartung war,
      dass ein Einstand-Stop den Rueckgabe-Verlust abfaengt. Er verschaerft
      ihn. Kein Parameter wird nachtraeglich angepasst; die Zelle ist
      geschlossen.
    angelegt: 2026-10-14
    declared_before_reading: true
    note: >-
      Angemeldet VOR jedem Lauf von scripts/compare_exits.py. Es existiert
      zu diesem Zeitpunkt keine Zahl zu diesem Arm -- die oben stehenden
      sind Journal-Statistik ueber die heutige Regel und nicht ueber die
