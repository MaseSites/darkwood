# Vorab-Registrierung der ersten Forschungscharge E0-E6
#
# Angelegt am 07.10.2026, Commit 9af96c7, VOR dem Lesen eines Ergebnisses.
# Grundlage: TRADING_BRAIN_CLAUDE_RECHERCHE_UND_UMBAUPROMPT.md, Abschnitt 8.
#
# Zweck dieser Datei: Arme, Merkmale, Fenster, Kennzahlen und die GESAMTZAHL der
# Vergleiche festschreiben, bevor Zahlen bekannt sind. Ohne das ist jede
# Mehrfachkorrektur eine Erzaehlung -- man korrigiert auf die Zellen, die man
# am Ende zeigen moechte, nicht auf die, die man angesehen hat.
#
# Diese Datei ist append-only in folgendem Sinn: ein Arm darf nach dem ersten
# gelesenen Ergebnis NICHT entfernt, umbenannt oder in seiner Kennzahl geaendert
# werden. Ein neuer Arm wird hinzugefuegt und erhoeht `total_comparisons`.
# Jede Aenderung nach dem ersten Lesen traegt Datum und Grund.

meta:
  created: 2026-10-07
  commit: 9af96c7
  goal:
    statement: "12'000 -> 15'000 bis zum 30.10.2026, Papierhandel, ohne Einzahlungen"
    window_start: 2026-10-13
    window_end: 2026-10-30
    days: 17
    status: "nicht erreichbar mit dem gemessenen System -- siehe urteil unten"
    stand_15okt: "12'075.56 USDT (+0.63 %), es fehlen 2'924 auf 15'000"
    note: >-
      Hier stand bis zum 15.10.2026 "1'000 CHF -> 20'000 CHF in sechs
      Monaten", die Zielmarke vom 07.10. Der laufende Auftrag ist ein
      anderer, und das Register hat seither gegen die falsche Marke
      geprueft. Der Unterschied ist nicht der Betrag, sondern die FRIST:
      17 Tage lassen bei diesem Takt rund 40 bis 60 Trades zu, und das ist
      der bindende Teil.
    urteil: >-
      **Nicht erreichbar, und das ist Zinseszins und keine Meinung.**

      Noetig je Trade, bei 1 % Risiko und 12'075.56 Ausgangsstand:

        bei  38 Chancen (2.52/Tag, gemessener Takt)   +0.58 R
        bei  61 Chancen (4.09/Tag, Signalrate)        +0.35 R
        bei 269 Chancen (17.9/Tag, 59 Maerkte)        +0.081 R

      Gemessen ueber 7.335 Replay-Trades, zwoelf Maerkte: **-0.0129 R**,
      Intervall [-0.044, +0.019].

      Selbst am GUENSTIGEN Rand dieses Intervalls und bei 59 Maerkten
      landet das Konto bei 12'708 -- es fehlen 2'292. Das Ziel liegt
      ausserhalb dessen, was die eigene Messung zulaesst, und nicht bloss
      ueber ihrem Mittelwert.

      Und die Zeit laesst sich nicht kaufen: bei der Signalrate braucht
      selbst ein aussergewoehnliches System (+0.30 R je Trade, also das
      Doppelte dessen, was gute Systeme dieser Art berichten) 18 Tage. Die
      Frist hat 15.
    was_wahr_sein_muesste: >-
      Damit es doch gelingt, muesste mindestens eines zutreffen, und keines
      davon ist belegt:

      * E14, E15 oder E17 liefern einen GROSSEN positiven Effekt auf A und
        B -- die Setups mit 89.6 % des Volumens. Die drei sind angemeldet,
        mit vorab festgelegten Toren, und nicht vollstaendig gelaufen. Sie
        vorauszusetzen waere genau das, was dieses Register verhindert.
      * Das Risiko je Trade steigt. Bei +0.15 R braeuchte es 3.83 % des
        Portfolios, also ueber der harten Grenze von 3 %; und der Deckel
        von 1 % steht, solange `calibration_proven` false ist.
      * Die Frist verschiebt sich. Bei +0.15 R und 59 Maerkten waere
        15'000 in rund 8 Tagen erreicht -- aber +0.15 R ist nicht gemessen,
        sondern die Zeile "ein sehr gutes System" in `scripts/goal.py`.
    wie_es_nachzurechnen_ist: "python scripts/goal.py"

  # Was bereits gemessen ist und NICHT erneut als neue Idee laufen darf.
  prior_search:
    register_attempts: 124
    distinct_arms: 87
    families_closed: 16
    families_untestable: 1
    champion_mean_r: -0.0340
    holdout_consultations: 0
    note: >-
      Der Champion ist negativ. "Schlaegt den Champion" ist deshalb KEINE
      Abnahmebedingung -- jeder Arm braucht zusaetzlich absolute Profitabilitaet
      nach Kosten. Ein verlierender Benchmark macht einen kleineren Verlust
      nicht zum Gewinn.

  # Die Zahl, auf die korrigiert wird. Summe der `comparisons` aller Arme unten
  # plus die bereits gelesenen Zellen der Vorgaenger-Suche, soweit dieselbe
  # Frage betroffen ist.
  # 21.10.2026: +4 fuer die vier Zellen des E22-Rueckgabe-Trails
  # (G in {0.25, 0.50, 0.75, 1.00}), vorregistriert am 20.10. in
  # audit/E22_TRAIL_VORREGISTRIERUNG.md und an diesem Tag gelaufen.
  # 21.10.2026: +2 fuer E24 (Volumen-/Dollar-Takt), vorregistriert, nicht gebaut.
  total_comparisons: 79
  correction: >-
    Bonferroni auf `total_comparisons` Vergleiche: Schwelle 0.05/n,
    Intervall 100*(1 - 0.05/n) %. Bei 70 also 0.000714 und 99.9286 %.

    Hier stand bis zum 14.10.2026 eine Beispielrechnung, die zwei
    verschiedene Zahlen nannte -- "Bei 65: Schwelle 0.05/67" -- also genau
    die Drift, die der Absatz darunter beklagt, und zwar im Satz, der sie
    beklagt. Jetzt steht die Formel statt einer Zahl.

    Der Text nannte bis zum 13.10.2026 die Zahl 55, waehrend darueber 61
    stand -- stehengeblieben bei 55 -> 58 -> 61. Die Zahl steht jetzt nur
    noch an EINER Stelle, damit sie nicht wieder auseinanderlaufen kann.
    Einzelne Studien korrigieren weiterhin auf die Zahl, die zu ihrer Zeit
    galt (46, 48, 52, 58); das unterkorrigiert die aelteren und ist hier
    vermerkt statt stillschweigend. Holm und gemeinsame Resampling-Tests (SPA/StepM) sind als
    angemeldete Sensitivitaet erlaubt, nicht als Ersatz. Sie werden zusaetzlich
    berichtet, nicht anstelle.

  windows:
    # Zeitlich geschachtelt, nie zufaellig geteilt. Alle Maerkte eines
    # Zeitpunkts gehoeren auf dieselbe Seite jeder Grenze.
    train: "Anfang der Historie bis 2025-09-30"
    develop: "2025-10-01 bis 2026-03-31 -- darf exploriert werden"
    confirm: "2026-04-01 bis 2026-10-06 -- einmal je eingefrorenem Kandidaten"
    holdout: "unberuehrt, 0 Konsultationen, nur fuer eingefrorene Kandidaten"
    forward: "ab 2026-10-07, waechst mit der Zeit, kann nicht wiederholt werden"
    purge_embargo: >-
      Purging um den vollen Label-Horizont plus ein Tag Embargo, auf
      Zeitstempeln geschnitten und nicht auf Zeilen.

  resampling:
    primary: "Wochenbloecke, alle Maerkte gemeinsam gezogen"
    sensitivities:
      - "stationaerer Bootstrap mit datenbasierter Blocklaenge"
      - "circular Bootstrap"
    note: >-
      Bei weniger als 30 Bloecken wird kein Intervall als belastbar berichtet.
      Stattdessen: Effekt als unsicher kennzeichnen, minimal nachweisbaren
      Effekt und Teststaerke zeigen, zusaetzliche unabhaengige Zeit sammeln.

  effective_sample:
    required_reporting:
      - raw_trades
      - calendar_days
      - week_blocks
      - label_overlap_candles
      - markets
      - design_effect_vs_iid
    note: >-
      Zwoelf korrelierte Maerkte erzeugen nicht zwoelfmal so viele unabhaengige
      Entscheidungen. Eine ESS-Zahl ist kennzahlabhaengig und wird je Kennzahl
      ausgewiesen, nicht einmal global behauptet.

  hard_limits:
    - "Echte Orders brauchen die 1,2-Sekunden-Bestaetigung. Keine Ausnahme."
    - "Keine echten Orders oder Wallet-Transaktionen durch LLM oder MCP."
    - "testnet=False und allow_live=True bleiben unabhaengig. Dieser Auftrag aktiviert keines."
    - "Handelskeys ohne Auszahlungsrecht. Ohne technischen Nachweis bleibt eine Venue Datenquelle."
    - "absolute_max_risk_pct = 0.030 bleibt. Hoeheres nur als getrenntes Stressszenario."
    - "Berechtigung und Identitaet fuer Live-Handel sind UNGEKLAERT, bis der Kontoinhaber verifiziert ist."
    - "Secrets ausserhalb Repository und Vault. Tests nie gegen Produktionsdatenbank."

