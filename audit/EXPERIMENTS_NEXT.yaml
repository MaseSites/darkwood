  - date: 2026-10-11
    by: "Claude, zwanzigstuendige Arbeitsphase"
    change: "Neuer Arm E11 angelegt, drei Zellen. total_comparisons 55 -> 58."
    reason: >-
      Die Literatursuche vom 11.10. hat in acht Ansatzfamilien keinen einzigen
      Kandidaten gefunden, der die gegnerische Pruefung ueberlebt. Sie hat aber
      genau einen Test empfohlen, der mit vorhandenen Daten eine ganze Familie
      schliesst: die PRAEMISSE des Volatilitaets-Overlays. Moreira/Muir
      funktioniert nur, wenn die erwartete Rendite NICHT mit der Volatilitaet
