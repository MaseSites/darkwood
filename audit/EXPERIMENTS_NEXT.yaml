      VOR dem ersten Lauf und mit leerem Zwischenspeicher:

        * beide Tore, Niveau 1 - 0.05/67, auf der DIFFERENZ
        * `two_group_difference` statt gepaart -- siehe acceptance
        * Block-Bootstrap statt Standardfehler (zwoelf korrelierte Maerkte)
        * die vier Rand-Kennzahlen aus `acceptance`

      Eine davon war ohne Codeaenderung NICHT messbar: "der Anteil der
      Gewinner, die der Einstand-Stop abschneidet". Ein Ausstieg am
      nachgezogenen Stop ist `ExitReason.STOP` wie jeder andere. Darum
      `Fill.stop_moved` (sim/broker.py), mit Test und Gegenprobe.
      Entscheidungsstempel a9f8dbc224e9 -> c35939713c6e, Golden-Test gruen:
      der Code hat sich bewegt, das Verhalten nicht.

      Das Instrument wurde an zwei erfundenen Stichproben geprueft, deren
      Antwort vorher feststand -- Vorteil in beiden Haelften (beide Tore
      auf, 0.86x) und Vorteil nur spaet (Tor 2 zu, 14.14x). Tor 1 allein
      haette den zweiten Fall durchgelassen. Dieselbe Probe hat einen
      echten Defekt gefangen: `--only-report` las die Symbolliste aus der
      Konfiguration statt aus dem Zwischenspeicher und berichtete ein
      Niveau ueber null Trades.

      Zu diesem Zeitpunkt existiert keine Zahl zu E14.1 oder E14.2.

  - id: E15
    title: "Die ZIELENTFERNUNG -- liegt das Ziel jenseits des Umkehrpunkts?"
    priority: 1
    cells: 3
    comparisons: 3
    arms:
      - id: E15.1
        name: "Zieldeckel bei 1.0 R (Ausstieg, nicht Ablehnung)"
      - id: E15.2
        name: "Zieldeckel bei 1.5 R"
      - id: E15.3
        name: "Zieldeckel bei 2.0 R"
    was_ich_VORHER_schon_gesehen_habe: >-
      Wie bei E14 ist dieser Arm NICHT blind angelegt, und das zu verschweigen
      waere unredlich. Er entstand aus einer beschreibenden Auswertung der
      post_mortem-Felder, 2.734 Replay-Trades, am 14.10.2026 VOR der
      Anmeldung:

        Ziel geplant, Median        +1.905 R   Mittel +2.147 R
        beste Lage, Median          +1.073 R   Mittel +1.496 R
        Ergebnis, Median            -1.028 R   Mittel -0.091 R

        beste Lage >= geplantes Ziel:   34.6 %
        Ziel NIE erreicht, auch nicht kurz:  67.8 %

        **Korrigiert, noch am selben Tag.** Zuerst stand hier 65.4 %, und
        die Zahl war an einem gemischten Nenner gerechnet: `examine()`
        bekommt `entry=fill.entry_price` und `stop=reason.stop`, also das
        Fill-Risiko, waehrend `reward_risk` das PLAN-Risiko benutzt. Bei
        85.7 % der Trades sind die beiden identisch; bei den uebrigen nicht,
        und 65 Trades wechseln dadurch die Seite. Konsistent gerechnet sind
        es 67.8 % statt 65.4 % -- die Richtung des Befunds wird dadurch
        staerker, nicht schwaecher, aber eine Zahl aus zwei Nennern ist
        keine Zahl.
        Abstand Ziel minus beste Lage, Median:  +0.837 R

        Schwelle   erreicht   danach im Minus   mittleres R
             0.5     67.8 %           52.6 %        +0.3496
             1.0     51.8 %           38.0 %        +0.7743
             1.5     41.6 %           23.0 %        +1.2121
             2.0     25.4 %           19.7 %        +1.4946
             2.5     14.9 %           22.4 %        +1.6186
             3.0      9.5 %           26.8 %        +1.7007

        Ausgaenge: target 31.9 % (+1.8433 R), stop 68.0 % (-0.9980 R)

      **Und diese Tabelle hat mir schon gesagt, welche Schwelle gut
      aussieht.** Eine naive Rechnung -- Trefferquote an der Schwelle mal
      Schwelle minus Rest mal 1 R -- ergibt bei 1.0 und 1.5 ein positives
      Vorzeichen und bei 2.0 ein negatives. Darum ist das Raster hier
      ABSICHTLICH so gelegt, dass es nicht die beste Zelle auswaehlt: alle
      drei werden gelaufen, alle drei zaehlen als Vergleich, und 2.0 liegt
      dicht am heutigen Median von 1.905 und ist damit beinahe eine
      Kontrolle. Waehlte ich nur 1.0 und 1.5, waere das Auswahl auf
      denselben Daten, aus denen die Vermutung stammt.

      Was die Tabelle NICHT ist: ein Ergebnis. Dieselbe Einschraenkung wie
      bei E14, und hier sogar staerker -- ein naeheres Ziel beendet Trades
      frueher, gibt den Platz frueher frei, und die danach entstehenden
      Trades sind ANDERE. Das kann nur der Motor abbilden.
    acceptance: >-
      Beide Tore, wie fuer jeden Arm. Korrigiertes Intervall ohne Null auf
      der Differenz zur heutigen Regel, Niveau 1 - 0.05/70, UND Replikation
      0.5-2.0x zwischen der frueheren und der spaeteren Haelfte.

      Primaerkennzahl NETTO-R je Trade, ungepaart -- derselbe Grund wie bei
      E14: die Mengen unterscheiden sich, weil die Belegung sich
      unterscheidet.

      Der Rand, vorab festgelegt: Anteil unter -1R, schlimmster
      Einzelverlust, 5%-Quantil, Anteil der Ausstiege am Ziel, und die
      mittlere Haltedauer. Die letzte steht dabei, weil ein naeheres Ziel
      die Haltedauer verkuerzt und damit den Durchsatz erhoeht -- das ist
      ein ERWUENSCHTER Nebeneffekt und darf trotzdem nicht als Teil des
      Ergebnisses gelesen werden.
    warum_ueberhaupt: >-
      E3 hat die Ausgaenge geprueft -- Basis, 24h-Zeitausstieg,
      2.0-ATR-Trailing -- und die ENTFERNUNG des Ziels nie variiert. Das
      Ziel lag immer dort, wo die Struktur es hinlegte, und niemand hat
      gemessen, ob dieser Ort erreichbar ist.

      Die Beschreibung oben sagt: in 67.8 % der Faelle nicht. Das ist eine
      andere Aussage als "der Ausstieg gibt es zurueck" (E14). Dort geht es
      um einen Trade, der vorn lag und zurueckkam; hier um einen, der nie
      dort war, wo er hin sollte.
    die_falle_die_dabei_auffiel: >-
      WICHTIG fuer jeden, der das laufen laesst. `min_reward_risk: 1.5`
      lehnt jeden Vorschlag mit einem Chance-Risiko unter 1.5 ab
      (`sim/plan.py:164`). Haette der Zieldeckel im VORSCHLAG gegriffen,
      haette E15.1 (1.0 R) damit **jeden Trade abgelehnt** -- null Trades,
      und die naheliegende "Reparatur" waere gewesen, eine Schutzregel
      aufzuweichen, um ein Ergebnis zu bekommen.

      Darum greift der Deckel im SIMULATOR, wie `breakeven_at_r`: die
      Einstiegspopulation bleibt fest, die Ablehnungsregeln bleiben
      unberuehrt, und gemessen wird allein der Ausstieg. Das ist auch die
      sauberere Messung -- der andere Entwurf haette zwei Effekte
      vermischt, weniger genommene Trades und frueheren Ausstieg.
    gegenargument_das_vorher_steht: >-
      Ein naeheres Ziel verschiebt die Auszahlung nach unten und die
      Trefferquote nach oben. Das Produkt entscheidet, und die gemessene
      Auszahlung ist 1:1.802 -- ein Ziel, das die Gewinner halbiert, muss
      die Trefferquote mehr als verdoppeln, um dasselbe zu leisten. Die
      Tabelle oben legt nahe, dass das bei 1.0 und 1.5 gelingt; sie zaehlt
      aber nur die eine Seite, weil sie die Trades beschreibt, die unter
      dem WEITEN Ziel entstanden sind.

      Dazu die Lehre aus [[hit-rate-is-a-misleading-target]]: zwei
      Messungen in diesem Projekt haben Populationen mit HOEHERER
      Trefferquote gefunden, die weniger verdienen. Eine steigende
      Trefferquote ist hier also ausdruecklich kein Zwischenerfolg.
    status: gelaufen_gefallen
    gelaufen: 2026-10-18
    ergebnis: >-
      **Gefallen, alle drei Zellen.** Die beste scheitert nicht am
      Vorzeichen, sondern an der Replikation:

        Basis                 n=7335   -0.0129 R  [-0.067, +0.040]
        Ziel gedeckelt 1 R    n=9528   -0.0052 R  [-0.041, +0.029]
          Differenz                    +0.0077 R  [-0.057, +0.071]
          Replikation                  +0.06x     (frueh +0.0146, spaet +0.0009)
        Ziel gedeckelt 1.5 R  n=8175   -0.0168 R  [-0.062, +0.030]
          Differenz                    -0.0038 R  [-0.075, +0.067]
          Replikation                  -1.77x
        Ziel gedeckelt 2 R    n=7566   -0.0075 R  [-0.059, +0.045]
          Differenz                    +0.0054 R  [-0.069, +0.078]
          Replikation                  -0.29x

      Der Deckel bei 1 R ist der beste Arm des gesamten Satzes: -0.0052 R
      gegen -0.0129 R, also +0.0077 R besser als die Basis. Sein Intervall
      spannt die Null, UND seine Replikation liegt bei 0.06x -- weit
      ausserhalb des vorab festgelegten Bandes 0.5-2.0x. Der Effekt existiert
      nur in der ersten Haelfte (+0.0146 R) und ist in der zweiten praktisch
      verschwunden (+0.0009 R).
    warum_das_replikationstor_hier_zaehlt: >-
      Dies ist genau der Fall, fuer den es geschrieben wurde: ein plausibler
      positiver Punktwert mit einer Zeitabhaengigkeit, die ein einzelnes
      Intervall nicht zeigt. Haette nur das Intervall entschieden, waere
      "knapp verfehlt, naeher ansehen" die Folgerung gewesen -- und der
      naechste Schritt waere gewesen, auf denselben Daten eine Variante zu
      suchen, die es knapp schafft.

      Das Band wird nicht geaendert, jetzt nicht und nicht nachtraeglich.
    note: >-
      Alle drei Zellen waren vorab angemeldet und zaehlen in
      `total_comparisons`. Kein Handelsparameter wird geaendert.
    angelegt: 2026-10-14
    declared_before_reading: true
    note: >-
      Angemeldet VOR jeder Zeile Code fuer den Zieldeckel und vor jedem
      Lauf. Es existiert zu diesem Zeitpunkt keine Zahl zu E15.1, E15.2
      oder E15.3 -- die Tabelle oben beschreibt die heutige Regel.

      Der Lauf wartet, bis E14 die Maschine freigibt; beides sind volle
      Motorlaeufe ueber 12 Maerkte.

  - id: E16
    title: "Setup F abschalten -- derselbe Fall wie C, nur fuenf Tage unsichtbar"
    priority: 1
    cells: 1
    comparisons: 1
    arms:
      - id: E16.1
        name: "Pool ohne F gegen Pool wie ausgeliefert"
    was_ich_VORHER_schon_gesehen_habe: >-
      Dieser Arm ist NICHT blind angelegt, und der Grund, warum er erst jetzt
      entsteht, ist selbst der Befund.

      `journal/build.py:_setup_for` schrieb Trades dem ersten Setup zu, das
      auf ihrem Balken feuerte -- aus `TRADEABLE`, also einschliesslich der
      ABGESCHALTETEN. C steht an Stelle 2 von sechs, vor E, F und G. In
      `data/replay_fills/` trugen darum 204 von 7.335 Trades (2.8 %) das
      Etikett "C", obwohl C seit dem 04.10.2026 aus ist, und sie waren E, F
      und G gestohlen. F stand mit 25 Trades in der Statistik und hatte 68.

      `Fill.setup` trug die Wahrheit die ganze Zeit -- der Pool setzt es beim
      Feuern. Nach `fills.setup` gerechnet, 7.335 Trades, zwoelf Maerkte,
      Stand e218664b39c8:

        Setup    n     Mittel   Treffer   R total   korrigiertes Intervall
        A     3529   -0.0137      41 %     -48.3
        B     3045   -0.0109      33 %     -33.3
        E      256   +0.0654      28 %     +16.8   [-0.293, +0.478]
        F       68   -0.7503       7 %     -51.0   [-1.042, -0.273]  ohne Null
        G      437   +0.0482      33 %     +21.1   [-0.185, +0.276]
        alle  7335   -0.0129      37 %     -94.8   [-0.045, +0.019]

      **F traegt 54 % des Gesamtverlusts bei 0.9 % der Trades.** Neun
      Maerkte, 02.2021 bis 03.2026, nicht in einem Markt konzentriert.
      5 Gewinner gegen 63 Verlierer, Median -1.037 R, 77.9 % verlieren mehr
      als ein R. Der beste Einzeltrade (+5.203 R) zieht den Mittelwert nach
      OBEN -- ohne ihn waere F noch schlechter.

      Beide Tore sind auf F's EIGENEN Trades erfuellt: korrigiertes Intervall
      ohne Null (Niveau 1 - 0.05/70) und Replikation +0.82x zwischen den
      Haelften (-0.8265 R frueh, -0.6740 R spaet).
    acceptance: >-
      **Und trotzdem ist das nicht der Beschluss.** Die Zahlen oben
      beschreiben F's eigene Trades. Gefragt ist die Wirkung des
      ENTFERNENS, und das ist eine andere Groesse: Setups konkurrieren um
      den Platz, also loescht das Weglassen eines Setups nicht seine Trades,
      sondern laesst andere feuern. Genau diese Verwechslung warnt
      `scripts/study_drop_setup.py` in seinem eigenen Docstring ab, und
      `eval_replay_rerun.py` hat sie einmal begangen.

      Das Instrument ist darum `scripts/study_drop_setup.py` -- zwei echte
      Pools durch den Motor, "alle" gegen "ohne F", ueber zwoelf Maerkte.
      Dasselbe Instrument, das C entschieden hat.

      Abnahme: korrigiertes Intervall ohne Null auf der Differenz der
      Pool-Mittelwerte UND Replikation 0.5-2.0x ueber die Haelften.
      Primaerkennzahl Netto-R je Trade; R TOTAL wird dazu berichtet, weil
      ein Setup zu entfernen die Trade-Zahl senkt und beide Richtungen
      sichtbar bleiben muessen.

      Der Rand vorab: Anteil unter -1R, schlimmster Einzelverlust,
      5 %-Quantil, und die Trade-Zahl je Pool.
    schaetzung_die_nicht_das_ergebnis_ist: >-
      Bei F ist der Platz-Effekt klein, anders als bei C: 68 von 7.335
      Trades, also werden nur in 68 Faellen Plaetze frei. Die naive Rechnung
      lautet damit -94.8 + 51.0 = -43.8 R auf 7.267 Trades, also -0.0060 R
      je Trade statt -0.0129 R -- der Verlust je Trade halbiert sich etwa.

      Das ist eine SCHAETZUNG und ausdruecklich kein Ergebnis. Sie zaehlt
      die Ersatztrades nicht, die in den freien Plaetzen entstehen, und
      deren Erwartung ist nicht null.
    warum_ueberhaupt: >-
      Dieselbe Begruendung, die C abgeschaltet hat, steht in
      `strategies/guide.py:enabled_setups`: "mehr als die Haelfte des
      Verlusts kommt aus einem Setup". Bei F sind es 54 %, und die Zahl war
      fuenf Tage lang unsichtbar, weil die Zuschreibung 43 seiner 68 Trades
      woanders verbuchte.

      Und es ist der groesste Hebel, der am 14.10.2026 gefunden wurde, der
      KEINE Regel lockert: F zu entfernen nimmt Trades weg, verletzt keine
      Schutzregel und braucht keine neue Datenquelle.
    gegenargument_das_vorher_steht: >-
      68 Trades sind wenig. Das korrigierte Intervall haelt trotzdem, weil
      der Effekt gross ist -- aber ein grosser Effekt auf kleiner Stichprobe
      ist auch die Form, die ein Zufall annimmt, und die Blocklaenge 4 sagt,
      dass die Abhaengigkeit hier kurz ist.

      Dazu: F ist in `audit/` nirgends als Verdaechtiger genannt. Dass er
      jetzt auffaellt, liegt an einer korrigierten Beschriftung und nicht an
      einer Suche -- das ist die guenstigere Herkunft, aber es bleibt eine
      Zelle, die aus den Daten aufgetaucht ist. Sie zaehlt als Vergleich.
    status: gelaufen_gefallen
    angelegt: 2026-10-14
    gelaufen: 2026-10-16
    declared_before_reading: false
    ergebnis: >-
      **Gefallen. Tor 1 haelt nicht.** Zwoelf Maerkte, zwei echte Pools durch
      den Motor, Zwischenspeicher `data/arms_alle.jsonl`, Niveau 99.932 %
      (73 Vergleiche):

        ohne (original)   n=7335   -0.0129 R   [-0.067, +0.040]   -94.78 R
        ohne Setup F      n=7331   -0.0068 R   [-0.062, +0.047]   -49.88 R
        Differenz                  +0.0061 R   [-0.070, +0.082]
        Replikation                +0.86x      (frueh +0.0066, spaet +0.0056)

      Tor 1 (Intervall ohne Null): NEIN. Tor 2 (Replikation 0.5-2.0x): ja.
      Beide waren vorab verlangt, also wird F NICHT abgeschaltet.

      Rand wie vorab verlangt: Anteil unter -1R 60.3 % gegen 60.2 %,
      schlimmster Einzelverlust -1.89 R in beiden, 5 %-Quantil -1.08 R in
      beiden. Der Arm verschlechtert den Rand nicht -- er entscheidet ihn
      auch nicht.
    was_die_zahlen_sonst_noch_sagen: >-
      **Die Vorab-Schaetzung traf.** Sie stand mit -0.0060 R je Trade im
      Register, bevor der Arm lief; gemessen sind -0.0068 R. Abweichung
      0.0008 R. Die Arithmetik "F's Verlust abziehen, Trades abziehen" war
      also richtig, und die Ersatztrades, deren Erwartung die Schaetzung
      ausdruecklich nicht kannte, haben sie nicht umgeworfen.

      **Die Population aendert sich um 3.6 %, nicht um 0.9 %.** Nach
      (Eroeffnungszeit, R) verglichen:

        identisch in beiden   7200   98.2 % der Basis
        nur in der Basis       135   entfallen
        nur ohne F             131   neu, in freigewordenen Plaetzen

      F hatte 68 Trades, es entfallen aber 135. Das Weglassen verschiebt die
      Platz-Zeitachse, also aendern sich auch Trades, die nichts mit F zu tun
      haben. Genau davor warnt der Arm in seiner eigenen Abnahme, und die
      Groesse ist jetzt gemessen statt behauptet: der Platz-Effekt ist
      DOPPELT so gross wie die Zahl der F-Trades.

      **R total halbiert sich: -94.78 auf -49.88, also +44.91 R.** Das war
      vorab als BERICHTETE Nebenkennzahl verlangt und ist keines der beiden
      Tore. Es waere der bequemste Satz dieses Tages und darum einer, bei dem
      Vorsicht angebracht ist: +44.91 R verteilt auf 266 geaenderte Trades
      sind +0.169 R je geaendertem Trade -- aber geprueft wird der Mittelwert
      ueber 7.331, und dort verduennt sich derselbe Effekt um den Faktor 27.
      Das Intervall spannt deshalb die Null, und das ist kein Messfehler,
      sondern die Frage, die das Tor stellt.
    was_daraus_folgt: >-
      F bleibt an. Kein Handelsparameter wird angefasst -- der Nachweis, den
      `config/risk.yaml` verlangt, existiert nicht.

      Die Teststaerke ist der eigentliche Befund und gilt fuer E14, E15 und
      E17 genauso: jeder dieser Arme aendert einen kleinen Teil der
      Population und wird am Mittelwert der ganzen gemessen. E18 ist deshalb
      angelegt -- mit der Kennzahl auf der geaenderten Teilmenge, VORHER
      erklaert, auf ungesehenen Maerkten.
    note: >-
      `declared_before_reading` steht auf FALSE, und das ist der ehrliche
      Wert: die Zelle entstand aus der Betrachtung der korrigierten
      Setup-Tabelle. Beide Tore sind auf F's eigenen Trades schon erfuellt,
      bevor der Arm lief -- was der Arm gemessen hat, ist eine andere
      Groesse (die Wirkung des Entfernens), und die faellt.

  - id: E17
    title: "Die Zeitebene des Setups -- ein geordneter Verlauf, auf 47 ungesehenen Maerkten zu pruefen"
    priority: 1
    status: gelaufen_gefallen
    ergebnis_20_10_2026: >-
      Gelaufen am 20.10. abends auf 56 ungesehenen Maerkten (audit/E17_ERGEBNIS.json,
      scripts/study_e17_zeitebene.py). E17.1 (nur H4/D1): +0.0341 R auf 4'110
      Trades, Intervall [-0.0694; +0.1377], Tor 1 gefallen; Verhaeltnis zu
      in-sample 0.65x, Tor 2 gehalten. E17.2 (ohne M15): +0.0006 R auf 16'063,
      beide Tore gefallen. Basis -0.0349 R auf 30'846. Schlechtester Markt
      BANDUSDT -0.309 R, 39 % der Maerkte negativ. Der einzige positive
      Kandidat der Familie ist damit out-of-sample tot.
    cells: 2
    comparisons: 2
    arms:
      - id: E17.1
        name: "Pool nur mit Setups, die auf H4 oder D1 feuern"
      - id: E17.2
        name: "Pool ohne M15-Setups (die untere Haelfte weggelassen)"
    vorab_arithmetik_16_10_2026: >-
      **Die Zelle, auf die alles zulaeuft, und ihr Preis.** Gerechnet aus
      `data/replay_fills/` nach `fills.setup` und `fills.timeframe` -- nur
      dort stehen Setup und Zeitebene zusammen, und die Laenge ist gegen
      `journal` geprueft. Zwoelf GESEHENE Maerkte, 7.335 Trades, Stand
      e218664b39c8. Das ist eine SCHAETZUNG und kein Ergebnis.

      Setup A hat einen geordneten Verlauf ueber alle vier Ebenen, und die
      Auszahlung ist dabei fest:

        Ebene    n     Treffer  Gewinner Verlierer Schwelle Abstand  Mittel
        D1     172      47.1 %   +1.487   -1.028    40.9 %  +6.2pp  +0.1565
        H4     704      44.2 %   +1.478   -1.048    41.5 %  +2.7pp  +0.0682
        H1    1309      41.0 %   +1.480   -1.054    41.6 %  -0.6pp  -0.0147
        M15   1344      38.5 %   +1.482   -1.055    41.6 %  -3.0pp  -0.0774

      Die Gewinnschwelle steht je Zelle aus IHRER Auszahlung, nicht aus einer
      gerundeten Erzaehlung. `p * Gewinner + (1-p) * Verlierer` reproduziert
      den Mittelwert ueber alle 20 Zellen auf 2.8e-16 R -- die Zerlegung
      gilt, weil die Auszahlung fest ist, und nur deshalb.

      **Nur A trägt den Verlauf.** B: M15 -0.0122, H1 -0.0148, H4 +0.0910,
      D1 -0.5042 (31 Trades, 16.1 % Treffer) -- nicht geordnet, D1 ist die
      schlechteste Zelle. G ist umgekehrt (H1 +0.1845 am besten, D1 -0.1561).
      E ist grob geordnet, aber D1 hat FUENF Trades.

      Die Kandidaten als Pool:

        Pool                     n     R/Trade   Anteil   Differenz z. Basis
        Basis (alles)         7335    -0.0129   100.0 %         --
        nur A auf D1+H4        876    +0.0856    11.9 %     +0.0985
        A+B auf D1+H4         1112    +0.0701    15.2 %     +0.0830
        A+B+E+G auf D1+H4     1300    +0.0614    17.7 %     +0.0743
        alles ohne M15        3718    +0.0121    50.7 %     +0.0250

      **KORREKTUR vom selben Tag: der beste Kandidat liegt NICHT ueber der
      Ziel-Anforderung.** Hier stand "+0.0856 R gegen +0.081 R, also
      darueber". Die +0.081 R stammen aus 269 Chancen bis zur Frist, und die
      269 aus `cap * 24 / MEDIAN(Haltedauer)`. Diese Formel ist falsch:
      Little verlangt `cap * 24 / MITTEL(Haltedauer)`, und der Live-Verlauf
      hat es entschieden (2.15 gemessene Abschluesse je Tag gegen 2.45 aus
      dem Mittel und 4.90 aus dem Median). Siehe `learn/target.py:
      sustainable_rate`.

      Mit der richtigen Formel: Obergrenze 3.64 statt 17.9 Trades/Tag,
      51 statt 269 Chancen bis zum 30.10., und das Ziel braucht
      **+0.42 R je Trade**. "nur A auf D1+H4" steht bei +0.0856 R -- also
      das Fuenffache zu wenig, nicht knapp darueber.

      Was bestehen bleibt: die Differenz +0.0985 R liegt ueber der
      Auflosungsgrenze (0.0349 R bei 59 Maerkten), der Arm ist also
      entscheidbar, anders als E16. Und +0.0856 R waere der erste positive
      Vorteil dieses Projekts ueberhaupt. Nur reicht er nicht fuer die
      Frist, und das stand hier zwei Stunden lang anders.
    was_der_durchsatz_dazu_sagt: >-
      **Und hier faellt die Frist, nicht die Kante.** Die Wirkung je Trade
      ist die Haelfte der Rechnung; die andere ist, wie oft der Pool feuert.
      Gemessen ueber 21.596 Markt-Tage:

        Basis            0.3397 Trades je Markt und Tag
        nur A auf D1+H4  0.0406 Trades je Markt und Tag

      +3.000 auf 12.000 sind +25 % und damit +25 R bei 1 % Risiko je Trade.
      Der beste Kandidat braucht dafuer 292 Trades:

        Maerkte  Trades/Tag  bis 30.10 (14 T)  Tage bis +25 R  ankommt
            12        0.49           7              600       07.06.2028
            59        2.39          34              122       15.02.2027
            83        3.37          47               87       10.01.2027

      Der Platzdeckel saettigt bei ~53 Maerkten (17.9 Trades/Tag). Bei 11.9 %
      Signalanteil bindet aber das ANGEBOT und nicht der Deckel, also
      skaliert die Rate linear mit den Maerkten und laeuft nicht an. Das ist
      der Unterschied zu `the-deadline-is-not-reachable`: dort war die Kante
      zu klein, hier ist sie gross genug und die GELEGENHEITEN fehlen.

      **KORREKTUR: das Datum verschiebt sich, weil der Deckel bindet.** Die
      Tabelle oben nimmt an, dass das ANGEBOT bindet, und skaliert die Rate
      linear mit den Maerkten. Das gilt nur, solange die Rate unter der
      Deckel-Obergrenze bleibt. Fuer den beschraenkten Pool ist die
      Obergrenze `5 * 24 / 54.4 h = 2.21 Trades/Tag` (mittlere Haltedauer
      54.4 h, Median 15.5 h -- obere Zeitebenen halten laenger). Das Angebot
      erreicht sie bei 54 Maerkten, und darueber hinaus aendert sich nichts
      mehr:

        Maerkte  Angebot  Deckel  es gilt  Tage bis +25 R  ankommt
            12     0.49    2.21     0.49        599        06.06.2028
            59     2.39    2.21     2.21        132        25.02.2027
            83     3.37    2.21     2.21        132        25.02.2027

      **Die Antwort auf "wie machen wir wirklich Geld" ist damit: ein auf D1
      und H4 beschraenkter A-Pool erreicht 15.000 um den 25.02.2027, und
      mehr als 54 Maerkte helfen nicht.** Vier Monate nach der Frist, und
      nur falls E17 auf den 56 ungesehenen Maerkten haelt.

      Der Deckel ist dabei der einzige Hebel, der uebrig bleibt -- aber er
      ist kleiner, als er aussieht. Zehn Plaetze liessen 4.41 Trades/Tag zu,
      doch dann bindet wieder das ANGEBOT: 0.0406 * 83 = 3.37/Tag, also 87
      Tage und der 10.01.2027. Fuenf Wochen gewonnen, nicht vier Monate.

      Hier stand zuerst "das Datum auf etwa den 02.12.2026" -- gerechnet mit
      4.41/Tag, also mit der Deckel-Obergrenze als Rate. Genau der Fehler,
      den dieser Abschnitt eine Zeile vorher beschreibt: eine Obergrenze ist
      keine Rate. Es gilt immer das Minimum aus beidem.

      Und `max_open_positions` folgt aus `floor(0.05/0.010)`, also aus dem
      Gesamtrisiko-Deckel. Den zu heben ist eine Risikoentscheidung und kein
      Durchsatzproblem. Sie wird hier NICHT getroffen.
    was_diese_schaetzung_NICHT_weiss: >-
      **Sie filtert eine bestehende Trade-Liste, und genau das hat E16 am
      16.10.2026 widerlegt.** Setups konkurrieren um die fuenf Plaetze. Ein
      Pool, der M15 und H1 weglaesst, hat deshalb nicht 11.9 % der Trades --
      er hat mehr, weil Plaetze frei werden und die oberen Ebenen oefter
      zum Zug kommen. E16 hat die Groesse dieses Effekts gemessen: beim
      Entfernen EINES Setups mit 68 Trades aenderten sich 135.

      Zwei Folgen, beide in derselben Richtung ungewiss:
        * 0.0406 Trades je Markt und Tag ist eine UNTERGRENZE. Der Durchsatz
          wird hoeher sein, das Datum also frueher.
        * +0.0856 R gilt fuer die Trades, die im unbeschraenkten Pool
          tatsaechlich entstanden sind. Die hinzukommenden Rand-Trades haben
          eine unbekannte Erwartung, und sie koennte schlechter sein -- sie
          entstehen an Stellen, wo vorher ein anderes Setup schneller war.

      Darum laeuft der Arm durch den MOTOR und nicht durch einen Filter. Was
      hier steht, ist der Rahmen, innerhalb dessen das Ergebnis liegen muss,
      damit es ueberhaupt plausibel ist -- nicht das Ergebnis.
    datenstand_16_10_2026: >-
      **Die Voraussetzung ist erfuellt, der Arm ist nur rechenblockiert.**
      Alle 56 ungesehenen Maerkte aus `data/unseen_markets.txt` haben
      Kerzenverzeichnisse unter `data/ohlcv/`, und zwar nicht nur Namen:
      jeweils 35-36 Parquet-Dateien ueber alle sechs Ebenen
      (D1/H1/H4/M1/M15/W1), 42-62 MB -- vergleichbar mit BTCUSDT (36 Dateien,
      69.6 MB). Keiner ist leer. Geprueft wurde die TIEFE und nicht die
      Existenz, weil "ein Verzeichnis sind keine Kerzen" in diesem Projekt
      schon einmal einen Arm fuer einen Tag blockiert hat.

      Die zwoelf vorhandenen `replay_fills/`-Dateien tragen den Stempel
      e218664b39c8 und muessen mit `--force` neu laufen; der laufende Stand
      ist d8c7f12104e4.
    was_ich_VORHER_schon_gesehen_habe: >-
      Alles unten stammt aus `data/replay_fills/` -- 7.335 Trades, zwoelf
      Maerkte, Stand e218664b39c8 -- und wurde am 15.10.2026 gesehen, BEVOR
      dieser Arm angelegt wurde. Es waere unredlich, das zu verschweigen,
      und es ist der Grund, warum die Bestaetigung ausdruecklich auf
      anderen Maerkten stattfindet.

      Nach Zeitebene des Setups, alle Trades:

        Ebene     n    BRUTTO R   Gebuehr R    NETTO R
        D1      252    +0.0587      0.0127    +0.0443
        H4     1083    +0.0688      0.0227    +0.0429
        H1     2396    +0.0198      0.0278    -0.0073
        M15    3604    -0.0073      0.0324    -0.0374

      Der Verlauf ist MONOTON ueber ein geordnetes Merkmal, und er ist
      nicht bloss die Gebuehr: die Gebuehren spannen 0.0197 R, das Brutto
      spannt 0.0761 R. Gebuehren erklaeren gut ein Viertel.

      Und er trifft dort, wo das Volumen liegt (A und B, 90 % der Trades):

        Ebene     n    BRUTTO R    NETTO R   Brutto-Intervall (95 %)
        D1      204    +0.0754    +0.0625    [-0.101, +0.235]
        H4      915    +0.0946    +0.0688    [+0.019, +0.169]
        H1     2132    +0.0106    -0.0159    [-0.045, +0.065]
        M15    3323    -0.0074    -0.0371    [-0.054, +0.039]

      A allein ist ueber alle vier Stufen monoton: +0.1641 / +0.0670 /
      -0.0198 / -0.0734.
    beide_tore_fallen_auf_diesen_daten: >-
      **Und das steht hier, bevor irgendetwas laeuft.** Auf den zwoelf
      Maerkten erfuellt der Befund KEINES der beiden Tore:

      Tor 1, korrigiertes Niveau 1 - 0.05/71 = 99.9296 %:

        A+B auf H4, brutto        95 %  [+0.019, +0.169]
                            korrigiert  [-0.033, +0.231]   Null drin
        Differenz hoch-tief       95 %  [+0.014, +0.166]
                            korrigiert  [-0.045, +0.223]   Null drin

      Das 95-%-Intervall ohne Null war eine Auswahl unter vier Ebenen. Am
      korrigierten Niveau bleibt nichts davon.

      Tor 2, Replikation ueber die Haelften (01.2021-01.2024 gegen
      01.2024-10.2026):

        H4+D1 (hoch)    frueh +0.1001   spaet +0.0833    +0.83x
        H1+M15 (tief)   frueh -0.0233   spaet +0.0229    -0.98x
        Differenz       frueh +0.1234   spaet +0.0604    +0.49x   knapp daneben

      Lehrreich ist die Zerlegung: die HOHE Gruppe repliziert ordentlich,
      die tiefe dreht das Vorzeichen und halbiert dadurch die Differenz.
      Die Instabilitaet sitzt also nicht in dem Teil, auf den der Arm
      setzt -- was den Kandidaten nicht rettet, aber sagt, wo man
      hinsehen muss.
    acceptance: >-
      **Bestaetigung auf 47 Maerkten, die nie durch den Motor gelaufen
      sind.** Das ist der Punkt dieses Arms: die Zahlen oben stammen aus
      zwoelf oft gelesenen Maerkten, und sie noch einmal dort zu pruefen
      waere dasselbe Lesen. Der Backfill hat 59 Maerkte vollstaendig
      gemacht; 47 davon haben keinen einzigen Trade in irgendeiner
      Auswertung dieses Projekts erzeugt.

      Vorab festgelegt, und zwar als Vorzeichen und nicht als Groesse: auf
      den 47 Maerkten muss der Brutto-Mittelwert von A+B auf H4+D1 ueber
      dem von A+B auf H1+M15 liegen, mit korrigiertem Intervall ohne Null
      auf der Differenz. Dazu Replikation 0.5-2.0x zwischen den Haelften
      DIESER 47 Maerkte.

      Primaerkennzahl ist BRUTTO-R je Trade, nicht netto. Der Grund steht
      oben: die Gebuehr haengt mechanisch an der Stopweite und damit an der
      Zeitebene, also wuerde netto einen Teil des Effekts messen, den man
      schon kennt. Netto wird daneben berichtet, weil es das ist, was
      bezahlt wird.

      Der Rand vorab: Anteil unter -1R, schlimmster Einzelverlust,
      5 %-Quantil, Trade-Zahl je Arm, und die Zahl der Maerkte, in denen
      die Richtung haelt. Das letzte, weil ein Effekt, der in 5 von 47
      Maerkten sitzt, etwas anderes ist als einer in 30 von 47.
    die_einschraenkung_die_vorher_stehen_muss: >-
      Die 47 Maerkte sind ausserhalb der Stichprobe in den MAERKTEN, nicht
      in der ZEIT: sie decken denselben Zeitraum. Ein Effekt, der an einer
      Marktphase haengt statt an der Zeitebene, wuerde dort ebenso
      erscheinen. Das ist eine echte Schwaeche dieser Pruefung und keine,
      die sich wegrechnen laesst -- die Zeit-Pruefung ist die
      Vorwaertsstichprobe, und die braucht Monate.

      Dazu: die 47 sind kleinere und juengere Maerkte als die zwoelf. Dass
      sie sich anders verhalten, ist moeglich und waere selbst ein Befund,
      aber es macht ein Scheitern dort mehrdeutig.
    warum_ueberhaupt: >-
      Weil es der erste geordnete Verlauf in diesem Projekt ist. Alles
      bisher Gefundene waren einzelne Zellen -- ein Markt, ein Setup, eine
      Stunde --, und eine gute Zelle unter vielen ist der Normalfall beim
      Suchen. Ein monotoner Verlauf ueber vier geordnete Stufen, der im
      BRUTTO sichtbar bleibt und die Setups mit 90 % des Volumens trifft,
      ist eine andere Art von Aussage.

      Und er ist handlungsnah: A+B auf H4 liegen netto bei +0.0688 R, und
      das Ziel braucht bei 59 Maerkten +0.081 R.
    gegenargument_das_vorher_steht: >-
      Der naechstliegende Mechanismus ist nicht die Zeitebene, sondern die
      STOPWEITE. Ein H4-Setup hat einen weiteren Stop, also weniger
      Gebuehr je R -- das ist gerechnet und erklaert ein Viertel. Was den
      Rest erklaert, ist unbekannt, und "unbekannter Mechanismus" ist in
      diesem Projekt bisher immer "Auswahl" gewesen.

      Dazu die naechstliegende Falle: weniger Ebenen heisst weniger
      Trades. H4+D1 sind 1.119 von 7.335, also 15 %. Bei zwoelf Maerkten
      waeren das 0.6 Trades am Tag und das Ziel unerreichbar; der Arm ist
      nur zusammen mit mehr Maerkten sinnvoll, und das steht in seiner
      Bewertung.
    korrektur_16okt: >-
      **Der Verlauf ist bei A, nicht bei A und B.** Angemeldet war er als
      "monotoner Verlauf ueber ein geordnetes Merkmal, der die Setups mit
      90 % des Volumens trifft". Je Setup nachgerechnet, Trefferquote
      brutto:

        Setup     D1      H4      H1     M15    Nullpunkt
        A      47.4 %  44.1 %  40.8 %  38.7 %   40.2 %   monoton
        B      16.1 %  35.6 %  32.8 %  33.7 %   33.0 %   KEIN Verlauf
        E         --   29.8 %  26.2 %  28.7 %   24-26 %  flach
        G      27.8 %  27.2 %  37.8 %  34.2 %   ~31 %    umgekehrt

      B hat keinen Verlauf, und B ist mit 3.045 Trades fast so gross wie A
      mit 3.529. Gepoolt sah es monoton aus, weil A's Verlauf stark und
      B's flach ist -- der Mittelwert zweier Gruppen zeigt die Form der
      staerkeren.

      Damit faellt die Begruendung weg, die den Arm von einer gewoehnlichen
      guten Zelle unterschied. Ein monotoner Verlauf in EINEM von fuenf
      Setups ist eine schwaechere Aussage als einer ueber das Volumen, und
      er ist naeher an dem, was dieses Projekt schon oft gesehen hat.

      Der Arm bleibt angemeldet, aber mit dieser Begruendung und nicht mit
      der alten: zu pruefen ist A, und die Abnahme auf den ungesehenen
      Maerkten muss A getrennt ausweisen. Ein Ergebnis, das nur gepoolt
      haelt, ist keines.
    was_die_zerlegung_sonst_zeigt: >-
      Die Auszahlung ist je Setup fest und ueber die Zeitebenen hinweg
      praktisch unveraendert -- bei A +1.50 Gewinner gegen -1.01 Verlierer
      auf allen vier Stufen. Der gesamte Unterschied zwischen den Stufen
      ist die TREFFERQUOTE; die Gegenprobe
      `Treffer*Gewinner + (1-Treffer)*Verlierer` geht auf die vierte
      Stelle auf.

      Das ist ein Grenzfall zu [[hit-rate-is-a-misleading-target]]: die
      Warnung dort gilt, wenn die Auszahlung mitwandert. Hier wandert sie
      nicht, weil das geplante Chance-Risiko auf allen Stufen 1.50 ist.
      Darum IST die Trefferquote hier die ganze Geschichte -- und nur
      darum.

      Und das Gesamtbild, das dabei entsteht: jedes Setup sitzt innerhalb
      weniger Prozentpunkte um seinen EIGENEN Nullpunkt, und die Gebuehr
      schiebt die meisten darunter. Das ist dieselbe Aussage wie
      [[entries-carry-no-edge]], nur je Setup aufgeloest statt gepoolt.

    status: angemeldet_nicht_gelaufen
    angelegt: 2026-10-15
    declared_before_reading: false
    note: >-
      `declared_before_reading` ist FALSE und zwar deutlich: der Arm
      entstand aus der Betrachtung der Tabelle oben. Genau deshalb liegt
      die Abnahme auf 47 Maerkten, die in keiner Auswertung dieses
      Projekts vorkommen -- was dort steht, ist noch nicht gesehen.

      Vorbedingung: `scripts/replay_all_markets.py` ueber die 47, mit
      --force fuer die zwoelf alten. Wartet, bis die Arme E14/E15/E16 die
      Maschine freigeben.






  - id: E24
    title: "Der Takt der Balken -- Volumen- oder Dollar-Balken statt Zeitbalken"
    priority: 2
    status: gebaut_laeuft
    registriert: 2026-10-21
    cells: 2
    comparisons: 2
    arms:
      - id: E24.1
        name: "Dieselben Setups auf Volumen-Balken (Basis-Asset-Volumen, Schwelle je Markt = Mittelwert des M15-Volumens)"
      - id: E24.2
        name: "Dieselben Setups auf Dollar-Balken (close * volume als Proxy, Schwelle analog)"
    aenderung_vor_dem_lauf_21_10_2026: >-
      Schwelle MITTELWERT statt Median, geaendert VOR dem ersten Messlauf und
      vor dem Lesen einer Ergebniszahl. Grund, gemessen an BTC und ADA: das
      M15-Volumen ist schief (BTC Mittel 1'073 gegen Median 623), mit dem
      Median entstuenden 1,85-mal so viele Balken wie M15-Kerzen, mit dem
      Mittelwert etwa gleich viele (BTC 165'988 Takt-Balken gegen 176'975
      M15-Kerzen im Rauchtest). Gleiche Kadenz ist Voraussetzung dafuer, dass
      die Tore eine Population und nicht eine Frequenz messen. Dazu bekannt
      und hingenommen: bei Dollar-Balken schwankt der M15-Median-Umsatz je
      Jahr bis 20x (ADA 2020 gegen 2021), eine feste Schwelle verteilt die
      Balken also sehr ungleich ueber die Jahre. Das ist die kanonische
      Definition und wird nicht nachjustiert.
    gebaut: >-
      21.10.2026 auf Anweisung des Eigentuemers nach der Erwartung "unentschieden".
      src/traidingbrain/data/takt.py (Erzeuger), close_ts-Spalte gelesen in
      analysis/pipeline.py, analysis/snapshot.py, sim/engine.py,
      journal/build.py; ohne Spalte byte-gleich (tests/test_backtest.py gruen).
      Lauf: scripts/study_e24_takt.py, Ausgabe data/replay_fills_e24/.
    anlass: >-
      Der Eigentuemer verlangt am 21.10. "Aufgaben, die uns viel zu overpowered
      bringen, damit wir die Trades praktisch nur noch gewinnen". Das Register
      ist die Antwort darauf: die Auswahl unter den Signalen (E1), die Ausgaenge
      (E3, E14, E15, E22), die Zeitebene (E17), die Kosten (E18), der Deckel
      (E13) und die Bewertungsschicht (21.10., 7'335 Zeilen) sind gemessen, und
      keines davon hebt die Trefferquote um mehr als wenige Punkte. Der
      Blindfleck-Audit vom 18.10. (audit/BLINDFLECK_AUDIT_18OKT.md, Abschnitt 3)
      nennt GENAU EINEN Kandidaten, den keine Arithmetik unter die Zielmarke
      begrenzt, weil er die Einstiegspopulation austauscht statt sie
      auszuwaehlen: der Takt der Balken. Er wird hier angemeldet, bevor eine
      Zahl existiert.
    hypothesis: >-
      Setups A und B, auf Volumen- oder Dollar-Balken statt auf M15/H1/H4/D1
      berechnet, erzeugen auf zwoelf Maerkten eine Population mit einer
      Trefferquote, die bei fester Auszahlung (1.50 / -1.01) netto positiv ist
      und das korrigierte Intervall ohne Null haelt.
    rechnung_vorab: >-
      Auszahlung fest: Gewinner +1.50 R, Verlierer -1.01 R, Break-even 40.2 %.
      Heute: Setup A 38.7 % auf M15 bis 47.1 % auf D1, B 33-36 %. "Praktisch
      nur gewinnen" ist keine Zelle, die irgendwo gemessen wurde; die beste
      Zelle mit n >= 100 ist A D1 mit 47.1 % (n=172). Das 20x-Ziel braucht
      +0.4536 R je Trade, bei dieser Auszahlung 66.75 % Trefferquote, also
      +27 bis +30 Prozentpunkte gegenueber heute. Zwei aggregationsinvariante
      Schranken sprechen dagegen: 35 Preismerkmale mit Korrelation 0.004 bis
      168 h (E-Outlook) und Beta 1.0 zu BTC mit negativem Residuum (E8).
      ERWARTUNG DES PRUEFERS: Punktwert innerhalb +-0.077 R, unentschieden.
      Dieser Arm ist eine Falsifikation, keine Rettung.
    gates: >-
      (a) netto R je Trade > 0 mit korrigiertem Intervall (79 Vergleiche) ohne
      Null, Wochenblock-Bootstrap wie E17; (b) Trefferquote in beiden Armen
      ueber 50 % auf mindestens 2'000 Trades, sonst ist "nur noch gewinnen"
      schon widerlegt, egal wie (a) ausgeht; (c) Replikation auf den 56
      E17-Maerkten mit Verhaeltnis >= 0.5x. Alle drei noetig.
    abgrenzung: >-
      Reiner Takt. Imbalance-, Tick-Run- oder Orderflow-Balken fallen unter
      die toten Datenfamilien (audit/DATENSUCHE_14OKT_LUECKEN.md) und sind
      hier NICHT gemeint. Keine neuen Setups, keine neuen Konstanten: dieselben
      Detektoren, nur der Balkenbegriff wechselt.
    was_zu_bauen_ist: >-
      (1) Balkenerzeuger aus data/ohlcv/<markt>/M1/*.parquet mit Volumen-
      bzw. Dollar-Schwelle, Ausgabe im OHLCV-Schema; (2) ein Timeframe-Wert,
      der kein Zeitraster ist -- `Timeframe` ist ein StrEnum mit
      timeframe_ms = minutes * 60_000, und mindestens analysis/, sim/ und das
      Replay setzen ein Zeitraster voraus; (3) Replay ueber zwoelf Maerkte wie
      replay_all_markets.py, dann ueber die 56 E17-Maerkte. Umfang: Tage, kein
      Nachmittag. Wird erst gebaut, wenn der Eigentuemer das nach dieser
      Erwartung noch will.
    on_success: "erster Kandidat ausserhalb der Zeitbalken-Familie; dann Vorwaertsstichprobe"
    on_failure: "die Familie der Preisstruktur-Setups ist auch im Takt erschoepft; Register schliesst sie endgueltig"

# ---------------------------------------------------------------------------
# Geschlossene DATENfamilien, 14.10.2026
#
# Kein Arm, sondern eine Negativliste: welche Daten gesucht, gepruefet und
# verworfen wurden. Sie steht hier, damit niemand -- auch ich nicht in drei
# Monaten -- dieselben acht Familien ein zweites Mal durchsucht.
#
# Verfahren: acht Agenten suchten je eine Familie (Literatur UND
# Beschaffbarkeit, Endpunkte selbst gelesen und heruntergeladen), 19
# Kandidaten kamen heraus, jeder wurde von vier unabhaengigen Linsen
# angegriffen -- Kosten, Horizont, Beschaffbarkeit, schon-geschlossen.
# 85 Agenten, 8.5 Mio Token, 1.274 Werkzeugaufrufe.
#
# ERGEBNIS: 19 von 19 gefallen. Kein Ueberlebender.
# ---------------------------------------------------------------------------
geschlossene_datenfamilien:
  stand: 2026-10-14
  bericht: audit/DATENSUCHE_14OKT_LUECKEN.md
  kandidaten_geprueft: 19
  ueberlebende: 0
  familien:
    orderbook: "Binance bookTicker/bookDepth, Bybit ob500 -- alle drei gefallen (4/4, 4/4, 3/4 Linsen)"
    trades: "Binance aggTrades, Bybit tick-Tape -- gefallen (2/4, 4/4)"
    liquidations: "Open Interest, Massen-Positionierung, Hyperliquid-Fill-Log -- alle drei 4/4"
    basis: "Premium-Index-Klines, OI+Taker-Ratio 5min, Hyperliquid-Stundenpremium -- 4/4, 3/4, 4/4"
    options: "DVOL/Varianzrisikopraemie, IV-Oberflaeche, Net Buying Pressure -- 4/4, 3/4, 4/4"
    onchain: "Stablecoin-Mints, Tether-Treasury-Transfers -- beide 4/4"
    crosssection: "Vesting-/Unlock-Kalender, breites Perp-Panel mit Delistings -- 3/4, 4/4"
    microstructure: "Binance aggTrades ms, Bybit tick -- 3/4, 4/4"
  was_das_heisst: >-
    Bis zu dieser Suche war "uns fehlen nur die richtigen Daten" eine
    lebende Hypothese. Drei UNABHAENGIGE Suchprogramme haben jetzt dasselbe
    geliefert: 87 Arme auf den vorhandenen Daten -> null; 32 Agenten ueber
    24 Literaturansaetze -> null; 19 Datenkandidaten ueber acht Familien ->
    null. Wenn drei verschiedene Verfahren dieselbe Null zurueckgeben, ist
    die wahrscheinlichste Erklaerung nicht, dass alle drei schlecht gesucht
    haben.
  was_offen_BLEIBT: >-
    Diese Suche ging ueber DATEN, nicht ueber AUSGAENGE. E14 (Stop auf
    Einstand) ist am selben Tag angemeldet und nicht gelaufen, und seine
    Motivation stammt aus einer Zahl, die in keinem der drei Suchprogramme
    vorkam: die beste Lage je Trade betraegt im Mittel +1.4964 R, das
    Ergebnis -0.0906 R. Das ist eine Aussage ueber den Ausstieg und keine
    ueber die Datenlage.
  zwei_messungen_die_sich_noch_lohnen:
    - >-
      Die eigenen Ausfuehrungsberichte: Markout der EIGENEN ruhenden Orders
      auf einem Kleinstkonto. Kann die gemessene -0.0129 R nur SENKEN, nicht
      retten -- bei Gebuehr null sind es +0.0151 R, also 2.8 % der
      benoetigten 0.54 R. Wert liegt in der Falsifikation.
    - >-
      Die Adresskohorte: Hyperliquid veroeffentlicht Position und
      Fill-Historie jeder Adresse. Die Frage ist nicht "habe ICH einen
      Vorteil", sondern "hat ihn ueberhaupt jemand". Beide Ausgaenge sind
      entscheidungsreif. Nur vorwaerts sammelbar (userFills haelt 10.000
      Zeilen je Adresse), also Wochen, nicht Tage.
  nicht_wiederholen: >-
    Die acht Familien oben sind durchsucht. Eine neunte Suche auf denselben
    zwoelf Maerkten ist bei 67 angemeldeten Vergleichen nicht nur wertlos,
    sie ist schaedlich: jeder weitere Arm senkt die Wahrscheinlichkeit,
    dass ein kuenftiges Positiv echt ist.


# Was dieser Apparat ueberhaupt auflosen kann -- gemessen am 16.10.2026.
#
# E16 lieferte +0.0061 R bei einer Halbbreite von 0.0774 R. Statt daraus
# "mehr Maerkte" zu folgern, wurde die Rechnung rueckwaerts gemacht: der
# Blockbootstrap desselben Berichts, auf hypothetische Stichprobengroessen
# skaliert (Halbbreite ~ 1/sqrt(n)).
#
#   Maerkte   Trades    kleinste nachweisbare Wirkung
#       12      7'335        0.0774 R
#       59     36'064        0.0349 R
#       83     50'734        0.0294 R
#
# Zwei Folgerungen, und die erste widerlegt eine Vermutung, die hier haette
# stehen koennen:
#
# 1. **Die Bonferroni-Korrektur ist NICHT der Engpass.** Ihr Preis ist
#    logarithmisch und laengst bezahlt: 1 Vergleich 0.0463 R, 20 Vergleiche
#    0.0673 R (+45 %), 67 Vergleiche 0.0772 R, 73 Vergleiche 0.0774 R,
#    74 Vergleiche 0.0777 R. Von 73 auf 74 kostet 0.4 %, von 73 auf 150
#    kostet 6.6 %. Eine Zelle anzumelden ist billig; die Verteuerung lag
#    bei den ersten zwanzig. Das Argument "die Korrektur ist zu streng"
#    ist damit erledigt -- auch ohne Korrektur waere die Halbbreite 0.0463 R
#    und E16 fiele.
#
# 2. **Der Engpass ist die Streuung je Trade.** +0.0061 R aufzuloesen
#    braeuchte das 160-fache an Trades: 1'175'000 Trades, etwa 1'922
#    Maerkte. Das ist nicht erreichbar, und kein Arm wird dafuer gerechnet.
#
# Der guenstige Teil: **das Ziel liegt ueber der Grenze.** Es braucht
# +0.081 R je Trade (A+B), und schon zwoelf Maerkte loesen 0.0774 R auf.
# Der Apparat ist also fuer genau die Wirkungsgroesse ausreichend, die
# zaehlt, und unzureichend fuer die, die es nicht aendern wuerde.
#
# Daraus die Regel unten: Rechenzeit nur fuer Arme, deren plausible Wirkung
# ueber der Grenze liegt. Nicht weil das Anmelden teuer waere, sondern weil
# das Ergebnis sonst unentscheidbar herauskommt, egal wie lange gerechnet
# wird. E14, E15 und E17 bestehen diese Pruefung: der Rueckgabe-Befund
# (Durchschnittstrade erreicht +1.1840 R, endet bei -0.0129 R) laesst
# Wirkungen weit ueber 0.0774 R zu.
rejection_rules:
  - "Ein Arm, dessen plausible Wirkung unter der Auflosungsgrenze liegt (0.0774 R bei zwoelf Maerkten, 0.0349 R bei 59), wird nicht gerechnet -- das Ergebnis waere unentscheidbar, nicht knapp."
  - "Ein 95%-Intervall ohne Null bei 46 angesehenen Vergleichen ist kein Ergebnis."
  - "Besser als der Champion (-0.0340 R) ist nicht profitabel."
  - "Eine Wiederholung ausserhalb des Bandes 0.5-2.0x faellt. Das Band wird nach Kenntnis eines Kandidatenergebnisses NICHT geaendert."
  - "Ein Arm, dessen Merkmale das Ergebnis kennen, ist ungueltig und wird nicht nachgebessert, sondern verworfen."
  - "Ein nach Betrachtung angepasstes Modell macht denselben Holdout nicht wieder unberuehrt."
  - "Ein Ergebnis auf Daten unbekannter oder gemischter Herkunft ist keine Messung."

