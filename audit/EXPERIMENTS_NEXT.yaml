    frage: >-
      Unser Simulator fuellt eine Limit-Order, wenn der Preis DURCH das Level
      handelt (`fill_on_touch: false`). Das ist strenger als Beruehrung, aber
      es ignoriert die Warteschlange: wer an einem Preis steht, wird nicht
      gefuellt, nur weil dort gehandelt wurde -- es kommt darauf an, wie viel
      vor einem liegt.
    warum_nicht_gegen_liquid: >-
      Die naheliegende Referenz waere Liquids Paper-Modus. Sie taugt nicht:
      (a) Liquids Fuellmodell ist NICHT dokumentiert, ein Unterschied gegen
      eine Blackbox sagt nur, dass zwei Modelle sich unterscheiden, nicht
      welches recht hat; (b) Liquid laeuft gegen LIVE-Daten, unsere Journal-
      Trades sind historisch, ein Replay gibt es nicht; (c) Liquids
      Perp-Gebuehren (Taker 0.095 %, Maker 0.065 %) sind das 1.7- bzw.
      3.25-fache der im Simulator angesetzten, womit jede PnL-Differenz von
      der Gebuehr dominiert waere und nicht von der Fuellung.
    methode: >-
      Gegen das aufgenommene Lighter-Tape, wo eine Fuellung BELEGT ist statt
      modelliert: das Buch traegt `order_id`, die Trades tragen `ask_id` und
      `bid_id`. Fuer jede beobachtete ruhende Order wird gefragt, was UNSERE
      Regel gesagt haette -- hat waehrend ihrer Lebenszeit ein Trade STRENG
      jenseits ihres Preises gedruckt -- und das gegen den belegten Ausgang
      gestellt.
    metrik: >-
      Falschfuell-Rate: Anteil der Orders, fuer die unsere Regel 'gefuellt'
      sagt, waehrend die Order belegt storniert wurde.
