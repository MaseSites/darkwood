    note: >-
      Angelegt VOR der ersten Ausfuehrung von scripts/study_vol_premise.py. Es
      existiert zu diesem Zeitpunkt keine Zahl zu diesem Arm.

      Drei Zellen, je ein Terzil der Volatilitaet bei Entry, gemessen an der
      BRUTTO-Erwartung je Trade. Vorab festgelegte Lesart:

        flach  -> das Overlay kauft Tail-Kontrolle, keinen Ertrag. Familie zu.
        STEIGT -> das Overlay ist aktiv schaedlich. Familie zu, Negativbefund.
        FAELLT -> und nur dann lohnt ein Overlay-Backtest.

      Und die Erwartungshaltung steht mit dabei, damit sie hinterher nicht
      nachgebessert wird: selbst der dritte Ausgang hebt den Sharpe und duennt
      den Rand, verwandelt aber eine negative Brutto-Erwartung nicht in eine
      positive. Bei -0.0906 R Entry-Erwartung und -0.20 R Vorwaerts-Residuum
      neben dem Markt gibt es nichts zu skalieren.
