    status: erledigt_kein_befund
    angelegt: 2026-10-11
    declared_before_reading: true
    confound_E12_3: >-
      ZWINGEND: E12.3 wird NUR innerhalb der M15-Population gemessen. Die
      Minutenmarke korreliert mit der Setup-Zeitebene -- H1-Setups steigen
      per Konstruktion auf :00 ein, M15-Setups auf jeder Viertelstunde. Ein
      Vergleich ueber alle Trades misst die Zeitebene und nicht die Uhr.
      Bricht die M15-Gruppe unter 100 Faelle je Zelle, ist die Zelle NICHT
      ENTSCHEIDBAR und wird so berichtet, nicht mit der gemischten
      Population gerettet.
    herkunft: >-
      Zwei Quellen, beide am 11.10.2026 geprueft.

      (1) Der Nutzer: "Goofia-Maerkte sind am Wochenende geschlossen, ich
      weiss nicht warum da so viel getradet wird." Die Tatsache ist falsch --
      Krypto-Perps laufen 24/7, geschlossen sind Aktien und Devisen. Die
      Intuition darunter ist aber eine Hypothese mit Literaturstuetze und auf
      unseren Daten pruefbar, und sie war nie gemessen.

      (2) Kim/Hansen, arXiv:2607.09426, "The Quarter-Hour Effect: Periodic
      Algorithmic Trading and Return Predictability in Cryptocurrency
      Futures": periodische Volatilitaets- und Volumenschuebe auf Minuten-,
      Fuenfminuten- und Viertelstundenmarken ueber sechs Binance-Perps,
      "opening returns show out-of-sample predictability at quarter-hour
      openings". Unsere Einstiege liegen per Konstruktion auf genau diesen
      Marken. Dazu die Beobachtung aus der Marktqualitaets-Literatur, dass
      Spreads um die Funding-Abrechnung weiter werden.
    was_der_arm_nicht_kann: >-
      Die Papier-Mechanik ist Orderfluss-Imbalance beim Viertelstunden-Open.
      Dafuer braucht man ein Trade-Tape, und das haben wir fuer dieses Buch
      nicht -- siehe die Lehre, dass dieses Buch keinen Fill beweisen kann.
      E12.3 prueft deshalb nur, ob die BESTEHENDEN Trades sich nach
      Minutenmarke unterscheiden. Ein Nullergebnis schliesst den
      Papier-Effekt nicht aus, es schliesst nur aus, dass er bei uns als
      Gruppenunterschied sichtbar ist.
    was_ein_positives_ergebnis_waere: >-
      Ein Zeitfilter aendert nur, WELCHE Trades existieren, nicht ihre
      Verteilung. Die Lehre aus `entries-carry-no-edge` gilt: ein Hebel, der
      bloss die Trade-Zahl aendert, kann das Vorzeichen nicht drehen. E12
      kann also bestenfalls eine Teilpopulation benennen, die fuer sich
      positiv ist -- und muss dann gegen das messen, was das System heute
      schon nimmt, nicht gegen alle Signale.
    result:
      stand: 2026-10-11
      bericht: audit/E12_DIE_UHR.md
      skript: scripts/study_the_clock.py
      daten: data/study_the_clock.json
      suchseite: "alter 4-Markt-Lauf, 2734 Trades, BRUTTO-R, Niveau 99.918 %"
      E12_1_wochenende: >-
        Sa/So n=516 -0.0956 R, unter -1R 60.3 %, schlimmster -3.778, q05
        -1.0395. Mo-Fr n=2218 -0.0207 R, unter -1R 55.9 %, schlimmster
        -2.461, q05 -1.0381. Differenz -0.0749 R [-0.3247, +0.1919] -- Null
