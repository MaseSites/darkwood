  - id: E8
    title: "Alpha oder Beta: traegt die Richtungswahl, oder traegt der Markt?"
    priority: 1
    arms:
      - id: E8.1
        name: "Zerlegung ueber alle Journal-Trades, Benchmark BTCUSDT"
        role: "Hauptzelle"
      - id: E8.2
        name: "Dieselbe Zerlegung nur ueber die Live-Trades (vorwaerts)"
    acceptance: >-
      Achsenabschnitt `a` mit korrigiertem Intervall ohne Null UND Replikation
      0.5-2.0x. Ein positives `b` bei einem `a`, dessen Intervall die Null
      enthaelt, ist ausdruecklich ein NEGATIVES Ergebnis: das System ist dann
      eine gehebelte Marktposition ohne eigenen Beitrag. Ein negatives `a`
      wird genauso berichtet wie ein positives.
    status: erledigt_negativ
    angelegt: 2026-10-08
    result:
      stand: 2026-10-08
      bericht: audit/E8_ALPHA_ODER_BETA.md
      skript: scripts/study_beta_alpha.py
      mechanik_geprueft: >-
        Gegen das eigene Symbol b = +0.874 [+0.767, +0.950] -- nahe 1, wie es
        sein muss. Der Rest dort, -0.0505 R, ist Maut plus Pfad.
      zellen:
        E8.1_alle_journal_trades: >-
          n=2748, a = -0.0823 R [-0.1414, -0.0119] (Null AUS),
          b = +0.985 [+0.873, +1.105]
        E8.2_nur_live_vorwaerts: >-
          n=14, a = +0.0048 R, b = +1.788 -- kein Intervall, wie vorab
          festgelegt (unter 30 Trades)
      replikation: >-
        Entwicklung a = -0.0560, Bestaetigung a = -0.1321, Verhaeltnis +2.36x
        -- AUSSERHALB 0.5-2.0x. Vorzeichen repliziert, Groesse nicht. Das Tor
        bleibt stehen: belegt ist die Abwesenheit eines positiven Rests, nicht
        die Groesse des negativen.
      befund: >-
        Das Beta ist eins (Replay) bis 1.79 (Live). Die +0.8023 R des
        Vorwaertslaufs sind gehebelte Marktrichtung und daneben +0.0048 R,
        also nichts. Ueber 2748 Trades ist der Rest zuverlaessig negativ.
        Nach der vorab festgelegten Lesehilfe ist das ein negatives Ergebnis.
      kosten_der_form: >-
        44 Trades bis zum 30.10. tragen 44 x 0.0823 R ~ 3.6 R Maut, bei 1 %
        Risiko also rund 3.6 % des Kontos -- nur dafuer, dass eine
        Marktmeinung durch 44 Trades statt durch eine Position laeuft.
    frage: >-
      Der Vorwaertslauf steht bei +0.8023 R je Trade auf 14 Trades. Alle
      vierzehn waren Short, und der Markt fiel im selben Fenster um 1.3 bis
      13.4 %. Zwei Erklaerungen passen gleich gut auf dieselbe Zahl, und sie
      fuehren zu entgegengesetzten Entscheidungen: entweder waehlt das System
      die Richtung, oder es war short in einer Abwaertswoche.
    methode: >-
      Zerlegung je Trade, nicht Eimer nach Regime. Fuer jeden Trade wird die
      BTC-Rendite ueber SEIN Haltefenster berechnet, mit dem Vorzeichen der
      Trade-Seite versehen und durch die Stop-Weite des Trades geteilt -- damit
      steht sie in derselben Einheit wie das Ergebnis, naemlich R. Dann
      Regression:
          r_multiple ~ a + b * (seite * btc_rendite / stop_anteil)
      `b` ist das Beta des Trades zum Kryptomarkt, `a` ist das, was ueberbleibt.
      Stop-Anteil aus `risk_amount / (qty * entry_price)`, weil der Stop nicht
      im Journal-Payload steht.
    warum_btc_und_nicht_das_eigene_symbol: >-
      Gegen das eigene Symbol gerechnet ist die Frage fast tautologisch: wer
      short ist und dessen Symbol faellt, gewinnt. Gegen BTC gerechnet ist der
      Rest genau die Auswahlleistung -- "dieses Symbol fiel mehr, als sein
      Beta zu BTC erwarten liess, und wir waren auf der richtigen Seite".
    metrik: "Achsenabschnitt a in R, mit Block-Bootstrap-Intervall"
    comparisons: 2
    zellen:
      - "a ueber alle Journal-Trades (Replay, grosse Stichprobe)"
      - "a ueber die Live-Trades allein (klein, aber vorwaerts)"
    tore:
      - "Korrigiertes Intervall ohne Null, Niveau 0.05/48"
      - "Replikation 0.5-2.0x zwischen Entwicklungs- und Bestaetigungsfenster"
    vorab_festgelegt:
      - >-
        Ein positives `b` bei einem Achsenabschnitt, dessen Intervall die Null
        enthaelt, ist ein NEGATIVES Ergebnis fuer diesen Arm: das System ist
        dann eine gehebelte Marktposition ohne eigenen Beitrag.
      - >-
        Ein negatives `a` wird genauso berichtet wie ein positives. Der Arm
        darf nach dem Lesen nicht zur "deskriptiven Nebenauswertung" erklaert
        werden.
      - >-
        Die 14 Live-Trades koennen dieses Tor nicht allein passieren. Bei
        dieser Stichprobe ist ein Intervall auf Niveau 0.05/48 breiter als
        jeder plausible Effekt. Das ist vorher bekannt und kein Grund, das
        Niveau nachher zu senken.

  - id: E9
    title: "Ist unsere Fuell-Annahme realistisch? Gegen das echte Buch gemessen"
    priority: 1
    arms:
      - id: E9.1
        name: "Unsere Regel: gefuellt, wenn der Preis STRENG durch das Level handelt"
        role: "zu pruefende Regel"
      - id: E9.2
        name: "Der belegte Ausgang aus dem Tape, per Id-Join (order_id gegen ask_id/bid_id)"
        role: "Wahrheit, kein Modell"
    acceptance: >-
      Falschfuell-Rate mit Intervall, berichtet als OBERGRENZE: das Buch wird
      alle 30s abgetastet, also sind langlebige Orders ueberrepraesentiert und
      die Verzerrung geht nach oben. Eine hohe Rate ist ein Befund GEGEN den
      eigenen Simulator und wird genauso berichtet wie eine niedrige. Kein
      Umbau des Simulators aufgrund dieser Zahl ohne Zustimmung des Nutzers.
    status: erledigt_positiv_fuer_den_simulator
    angelegt: 2026-10-08
    result:
      stand: 2026-10-08
      bericht: audit/E9_FUELL_REALISMUS.md
      skript: scripts/study_fill_realism.py
      orders: 545344
      maerkte: 6
      falschfuellung_gepoolt: "0.6 % [0.6, 0.7]"
      je_markt: >-
        BTC 0.8 %, ETH 0.6 %, SOL 0.5 %, XRP 0.2 %, DOGE 0.1 %, LINK 0.1 % --
        repliziert ueber alle sechs
      verpasste_fuellungen: "95-99 % je Markt"
      befund: >-
        Der Simulator ist auf der Fuellseite KONSERVATIV, nicht optimistisch.
        Wenn ein Trade jenseits eines Preises druckt, wurde alles an diesem
        Preis aufgebraucht -- `fill_on_touch: false` ist fast eine
        Implikation, keine Schaetzung. Umgekehrt verweigert die Regel
        praktisch jede echte Maker-Fuellung, weil ein Maker BEI seinem Preis
        gefuellt wird und nicht jenseits.
      verbietet_touch: >-
        Selbst am Antritt (0-1 bp vom Mid) fuellen nur 12.9 % der echten
        Orders. `fill_on_touch: true` waere um ein Vielfaches zu grosszuegig.
      nicht_belegt: >-
        Dass das System besser ist als gemessen. Die Regel verweigert
        Einstiege, bei denen der Preis das Level beruehrt und umkehrt -- bei
        einem Short oberhalb des Marktes der beste Einstieg. Das ist eine
        Hypothese mit benannter Richtung und gehoert gemessen.
      dringlichkeit_begrenzt: >-
        Im Vorwaertsbetrieb: 105 vorgeschlagen, 86 von der Risk Engine
        abgelehnt, 19 eroeffnet, 0 verfallen. Keine wartende Order ist je
        unbefuellt verfallen -- der Flaschenhals ist die Risikopruefung.
      warum_nicht_gegen_liquid: >-
        Fuellmodell nicht dokumentiert (geprueft); kein Replay, Liquid laeuft
        live; Gebuehren 0.095/0.065 % gegen angesetzte 0.055/0.02 %, also
        waere jede PnL-Differenz eine Gebuehrendifferenz; und der
        Papierhaendler ist ein Python-Prozess ohne MCP.
      keine_codeaenderung: >-
        Nichts am Simulator geaendert. Ein Vorschlag liegt dem Nutzer vor und
        wartet auf Zustimmung.
    frage: >-
      Unser Simulator fuellt eine Limit-Order, wenn der Preis DURCH das Level
      handelt (`fill_on_touch: false`). Das ist strenger als Beruehrung, aber
      es ignoriert die Warteschlange: wer an einem Preis steht, wird nicht
      gefuellt, nur weil dort gehandelt wurde -- es kommt darauf an, wie viel
      vor einem liegt.
    warum_nicht_gegen_liquid: >-
      Die naheliegende Referenz waere Liquids Paper-Modus. Sie taugt nicht:
      (a) Liquids Fuellmodell ist NICHT dokumentiert, ein Unterschied gegen
      eine Blackbox sagt nur, dass zwei Modelle sich unterscheiden, nicht
      welches recht hat; (b) Liquid laeuft gegen LIVE-Daten, unsere Journal-
      Trades sind historisch, ein Replay gibt es nicht; (c) Liquids
      Perp-Gebuehren (Taker 0.095 %, Maker 0.065 %) sind das 1.7- bzw.
      3.25-fache der im Simulator angesetzten, womit jede PnL-Differenz von
      der Gebuehr dominiert waere und nicht von der Fuellung.
    methode: >-
      Gegen das aufgenommene Lighter-Tape, wo eine Fuellung BELEGT ist statt
      modelliert: das Buch traegt `order_id`, die Trades tragen `ask_id` und
      `bid_id`. Fuer jede beobachtete ruhende Order wird gefragt, was UNSERE
      Regel gesagt haette -- hat waehrend ihrer Lebenszeit ein Trade STRENG
      jenseits ihres Preises gedruckt -- und das gegen den belegten Ausgang
      gestellt.
    metrik: >-
      Falschfuell-Rate: Anteil der Orders, fuer die unsere Regel 'gefuellt'
      sagt, waehrend die Order belegt storniert wurde.
    comparisons: 1
    zellen:
      - "Falschfuell-Rate ueber alle beobachteten Orders, mit Intervall"
    begleitend_deskriptiv:
      - "Dieselbe Rate nach Abstand vom Mid, weil unsere Einstiege nicht am Antritt liegen"
      - "Verpasste Fuellungen: Regel sagt nein, Order wurde belegt gefuellt"
    vorab_festgelegt:
      - >-
        Eine hohe Falschfuell-Rate ist ein Befund GEGEN den eigenen Simulator
        und wird genauso berichtet wie eine niedrige.
      - >-
        Die beobachtete Population sind die Orders anderer Leute, alle 30s
        abgetastet, also sind langlebige ueberrepraesentiert. Das verzerrt zu
        mehr beobachteten Stornos und damit zu einer HOEHEREN Falschfuell-Rate.
        Die Zahl ist deshalb eine Obergrenze, und das steht vor dem Lauf fest.
      - >-
        Kein Umbau des Simulators aufgrund dieser Zahl ohne ausdrueckliche
        Zustimmung des Nutzers.

