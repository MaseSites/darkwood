      - "Modell-IDs ueber die offizielle Models-API pruefen, nicht aus dem Namensschema ableiten"
      - "Der Cache reproduziert gespeicherte Antworten, garantiert keine identische neue"
      - "Replay und Forward-Shadow strikt getrennt"
      - "Keine autonome Prompt-Anpassung in einem Bestaetigungsfenster; neuer Prompt = neuer Arm"
