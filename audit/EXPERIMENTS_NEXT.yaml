      - id: E12.3
        name: "Entry auf der Stundenmarke (:00) gegen :15/:30/:45"
    acceptance: >-
      Zwei-Gruppen-Differenz mit korrigiertem Intervall ohne Null UND
      Replikation 0.5-2.0x zwischen altem 4-Markt-Lauf und neuem 12-Markt-Lauf.
      Zwei sich ueberlappende Intervalle nebeneinander sind KEIN Test.
      Primaerkennzahl ist die BRUTTO-Erwartung je Trade -- sonst ist jedes
      Ergebnis nur eine Gebuehrengeschichte und sagt nichts ueber den Einstieg.
      Zusaetzlich zwingend und VORHER festgelegt, nach der Lehre aus E10: der
      linke Rand beider Gruppen (Anteil unter -1R, schlimmster Einzelverlust,
