        name: "Spot-long / Perp-short, SAME VENUE, synchrone Quotes"
        formula: "q*(Spot_exit-Spot_entry) + q*(Perp_entry-Perp_exit) + Funding - Fees - Financing"
      - id: E6.2
        name: "Cross-Venue-Funding-Differenz, Long-Perp A gegen Short-Perp B"
      - id: E6.3
        name: "Durchhalten ohne Auswahl"
        role: Basis
    comparisons: 5
    requirements:
