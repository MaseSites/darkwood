    begleitend_deskriptiv:
      - "Dieselbe Rate nach Abstand vom Mid, weil unsere Einstiege nicht am Antritt liegen"
      - "Verpasste Fuellungen: Regel sagt nein, Order wurde belegt gefuellt"
    vorab_festgelegt:
      - >-
        Eine hohe Falschfuell-Rate ist ein Befund GEGEN den eigenen Simulator
        und wird genauso berichtet wie eine niedrige.
      - >-
        Die beobachtete Population sind die Orders anderer Leute, alle 30s
        abgetastet, also sind langlebige ueberrepraesentiert. Das verzerrt zu
