      - "Margin-Puffer gehoert in den Nenner der Kapitalrendite"
      - "Lokale Margin je Venue; Verrechnung ueber zwei Venues NICHT annehmen"
      - "Prognostizierte und realisierte Funding-Rate getrennt speichern"
