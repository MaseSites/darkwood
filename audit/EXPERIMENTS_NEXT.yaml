        AUSSERHALB 0.5-2.0, Vorzeichenwechsel. BEIDE Tore verfehlt.
      der_rand_ist_der_befund: >-
        Der Mittelwert sieht minimal besser aus und das Intervall sagt, dass
        das nichts ist. Bezahlt wird es mit dem 3.6-fachen schlimmsten
        Einzelverlust: -6.841 gegen -1.890 R. Bei 1 % Risiko je Trade ist das
        ein Konto-Einschlag von 6.8 % aus EINEM Trade -- mehr als die harte
        3-%-Grenze zulaesst. Haette nur der Mittelwert im Bericht gestanden,
        waeren +0.0064 R eine Verbesserung gewesen.
      ausloeser: >-
        Eine Zeile im Papierprotokoll. post_mortem.stopped_by_wick zaehlt 967
        von 2.749 Trades: 35.2 % aller Trades, 51.9 % aller Stops. Die
        groesste Population des Projekts, die nie als eigene Politik geprueft
        war -- E3 prueft Politiken, study_widen_stop.py die Weite, keiner den
        AUSLOESER.
      was_nicht_gilt: >-
        "Ohne die Docht-Stops waere das System +0.4151 R je Trade." Diese
        Zahl steht im Bericht nur als Warnung. Man darf die Verlierer nicht
        entfernen und den Rest behalten -- ein anderer Ausloeser verschiebt
        den Pfad ALLER Trades, auch der 2.256 mit erreichtem Ziel.
      bestehende_politik: >-
        Zum zweiten Mal nach E3 ist die bestehende Politik messbar besser als
        die Alternative. Es ist die Richtung, die ein Mensch beim Lesen der
        Nachbetrachtungen zuerst vorschlagen wuerde, weil 35.2 % gross aussieht.
    frage: >-
      Das Journal zaehlt selbst, wie oft ein Stop von einem Docht geholt wird,
      dessen Kerze wieder auf der richtigen Seite schliesst: `stopped_by_wick`.
      Gemessen ueber 2.749 Trades sind das **967, also 35.2 % ALLER Trades und
      51.9 % aller Stops**. Das ist die groesste einzelne Population, die in
      diesem Projekt noch nie als eigene Politik geprueft wurde.
    warum_das_neu_ist: >-
      E3 hat Ausgangs-POLITIKEN geprueft (24h-Uhr, 2.0-ATR-Trail) und
      study_widen_stop.py die WEITE des Stops. Beide lassen den AUSLOESER
      unangetastet: der Stop greift bei Beruehrung. Ein schlusskurs-
      bestaetigter Stop laesst den Stop, wo er ist, und verlangt eine
      Bestaetigung. Das ist eine dritte Sache und steht in keinem der 49
      bisherigen Vergleiche.
    arme:
      E10.1: "Basis, unveraendert: Stop bei Beruehrung, Ziel bei Beruehrung"
      E10.2: >-
        Stop nur, wenn eine Signalkerze (M15) JENSEITS des Stops SCHLIESST.
        Ziel unveraendert bei Beruehrung.
    methode: "Gepaart auf identischen Einstiegen, wie E3. Differenz je Trade."
    metrik: "Gepaarte Differenz des net_r, mit Block-Bootstrap-Intervall"
    comparisons: 1
    zwei_sicherungen_die_ein_naiver_test_vergisst:
      - >-
        LIQUIDATION GREIFT WEITER BEI BERUEHRUNG. Die Boerse wartet auf keinen
        Schlusskurs. Ohne das waere der Arm eine Fiktion, in der man Verluste
        aussitzt, die ein echtes Konto nicht aussitzen kann -- und der Hebel
        ist so gesetzt, dass die Liquidation nur 2.5 Stop-Abstaende hinter dem
        Stop liegt.
      - >-
        DIE VERLUSTVERTEILUNG WIRD BERICHTET, NICHT NUR DER MITTELWERT. Ein
        Stop, der auf einen Schlusskurs wartet, kann mehr als 1R verlieren.
        Der Anteil der Trades unter -1R, der schlimmste Einzelverlust und die
        Zahl der Liquidationen gehoeren in den Bericht, sonst ist ein besserer
        Mittelwert eine Taeuschung ueber den Rand der Verteilung.
    tore:
      - "Korrigiertes Intervall ohne Null, Niveau 0.05/50"
      - "Replikation 0.5-2.0x zwischen Entwicklungs- und Bestaetigungsfenster"
    vorab_festgelegt:
      - >-
        Ein besserer Mittelwert bei gleichzeitig schwererem linken Rand ist
        KEIN positives Ergebnis. Beides wird berichtet, und die Entscheidung
        darueber gehoert dem Nutzer, nicht dem Skript.
      - >-
        Dieser Arm aendert die Bedeutung von `risk_amount`: der geplante
        Verlust ist nicht mehr der tatsaechliche Hoechstverlust. Das beruehrt
        die harte 3-%-Grenze und laeuft deshalb AUSSCHLIESSLICH im Simulator,
        als Stressszenario -- nicht als Vorschlag fuer die Risk Engine.
      - >-
        Die 35.2 % sind eine Haeufigkeit, kein Ertrag. Die Rechnung "ohne die
        Docht-Stops waere das System +0.4151 R je Trade" steht im Journal und
        ist BEDEUTUNGSLOS: man darf die Verlierer nicht entfernen und den Rest
        behalten. Nur ein neu simulierter Pfad entscheidet.

  - id: E4V
    title: "Vorpruefung von E4 auf dem Ueberlebenden-Satz -- ein Schirm, kein Ergebnis"
    priority: 1
    status: erledigt_negativ
    angelegt: 2026-10-09
    result:
      stand: 2026-10-09
      bericht: audit/E4V_RELATIVE_VALUE_VORPRUEFUNG.md
      skript: scripts/study_relative_value.py
      tage: 2221
      arme:
        E4V.1_residual_reversion: >-
          brutto -5.20 bp/Tag, Umschlag 1.30, Funding -0.06 bp,
          netto -12.43 bp/Tag [-22.46, -1.33] -- Null AUSGESCHLOSSEN, auf der
          falschen Seite
        E4V.2_gleichgewichtet: >-
          brutto +20.73 bp/Tag, netto +12.53 bp/Tag [-16.20, +47.56] --
          Null enthalten. Krypto-Beta, auf diesem Niveau nicht von Null zu
          unterscheiden
      replikation: "frueher -11.67, spaeter -20.55, Verhaeltnis +1.76x -- IM BAND"
      einzelmarkt_pruefung: >-
        Jeden der zwoelf Maerkte einmal ausgelassen: -11.47 bis -16.54 bp/Tag,
        groesste Verschiebung -4.11 bp (ohne ATOM). Kein einzelner Markt
        traegt das Ergebnis.
      und_das_spiegelbild_verliert_auch: >-
        Brutto 5.20 bp gegen eine Maut von 1.30 x 5.5 = 7.15 bp. Reversion
        -12.35, Momentum +5.20 - 7.15 = -1.95 bp/Tag. BEIDE Vorzeichen
        verlieren nach Kosten -- darum braucht das Spiegelbild keinen zweiten
        Lauf und das Vorzeichen wird nicht nachtraeglich gedreht.
      no_trade_zone: >-
        In E4s requirements genannt, hier bewusst nicht implementiert: sie
        ueberspringt Tage, an denen das Brutto die Maut nicht deckt, und
        fuehrt bei negativem Brutto gegen Null statt ins Positive.
      entscheidung: >-
        Nach der vorab festgelegten Asymmetrie: E4 bleibt blockiert, der
        grosse Kursdownload (232-749 Symbole plus 138 delistete aus dem
        Archiv) unterbleibt. Der groesste offene Einzelbau des
        Forschungsplans ist durch eine Messung von einer Minute Laufzeit
        nicht mehr zu rechtfertigen.
    frage: >-
      Traegt ein marktbereinigter Querschnitt ueberhaupt etwas, wenn man ihn
      auf den zwoelf Maerkten rechnet, fuer die Kurse vorliegen?
    warum_als_eigener_arm_und_nicht_als_E4: >-
      E4 verlangt ein Punkt-in-Zeit-Universum mit Kursen. Das fehlt (siehe
      E4.blocker_korrigiert). Diese Vorpruefung auf zwoelf Ueberlebenden darf
      deshalb NICHT als E4 gelten und verbraucht keine von E4s sechs
      angemeldeten Zellen. Sie ist ein Schirm mit einer klaren Asymmetrie:
        * Faellt sie NEGATIV aus, ist das aussagekraeftig -- der Satz ist der
          liquideste und am staerksten ueberlebende, den es gibt, und eine
          Methode, die dort nichts findet, wird durch mehr Symbole nicht
          besser. Dann bleibt E4 blockiert und der grosse Kursdownload
          unterbleibt.
        * Faellt sie POSITIV aus, ist das KEIN Befund, sondern genau die
          Rechtfertigung fuer den Download. Erst danach zaehlt E4.
      Die Richtung der Survivorship-Verzerrung ist bei Long/Short NICHT
      vorab bestimmt -- das steht schon in E4.pitfalls_declared und gilt
      hier genauso. Darum taugt ein positives Ergebnis hier nicht als Beleg.
    arms:
      - id: E4V.1
        name: "Residual-Momentum nach kausal geschaetztem Marktfaktor, Haltedauer 1 Tag"
      - id: E4V.2
        name: "Gleichgewichtetes Halten derselben zwoelf Maerkte"
        role: "Kontrolle"
    methode: >-
      Faktor je Stichtag NUR aus der Vergangenheit: Querschnittsmittel der
      Renditen des Vortages als Marktkomponente, Beta je Markt aus einem
      rueckwaertigen Fenster. Residual = Rendite minus Beta mal Faktor.
      Signal = Rang des Residuums, Long die untere Haelfte oder obere Haelfte
      je nach vorab fixiertem Vorzeichen, dollar-neutral. Kosten: Maut je
      Umschichtung auf beiden Beinen, Funding je Haltezeit.
    metric: "Netto-Rendite je Umschichtung, mit Block-Bootstrap-Intervall"
    comparisons: 2
    acceptance: >-
      Korrigiertes Intervall ohne Null auf Niveau 0.05/52 UND Replikation
      0.5-2.0x zwischen Entwicklungs- und Bestaetigungsfenster. Zusaetzlich
      zwingend: das Ergebnis darf nicht an einem einzelnen Markt haengen --
      die Rechnung wird je Markt ausgelassen und erneut gemacht.
    vorab_festgelegt:
      - "Vorzeichen des Signals steht VOR dem Lauf fest: Long das NIEDRIGSTE Residuum (Reversion)."
      - "Haltedauer 1 Tag, taegliche Umschichtung. Kein zweiter Horizont in diesem Schirm."
      - >-
        Zwoelf korrelierte Maerkte sind NICHT zwoelf unabhaengige
        Beobachtungen. Das Intervall wird ueber die Zeitreihe der
        Portfoliorenditen gerechnet, nicht ueber Markt-Trade-Paare.
      - >-
        Die frueheren Arme mom_7/mom_30/vol_30 werden NICHT wiederbelebt. Der
        Unterschied ist die Faktorbereinigung, und wenn der bereinigte Arm
        dasselbe Ergebnis liefert wie der rohe, ist das zu berichten.

  - id: E4W
    title: "Derselbe Querschnitt mit kleinerem Umschlag -- woechentlich statt taeglich"
    priority: 1
    status: erledigt_negativ
    angelegt: 2026-10-09
    result:
      stand: 2026-10-09
      bericht: audit/E4W_KLEINERER_UMSCHLAG.md
      skript: "scripts/study_relative_value.py --hold 5"
      umschichtungen: 442
      gegenprobe: >-
        --hold 1 reproduziert E4V auf die zweite Dezimale (-12.43 bp/Tag). Der
        Umbau auf einen Horizontparameter hat die alte Rechnung nicht
        veraendert.
      arme:
        E4W.1_reversion: "-8.20 bp/Tag [-21.09, +3.26] -- Null enthalten"
        E4W.2_momentum: "+5.33 bp/Tag [-6.21, +18.27] -- Null enthalten"
        E4W.3_kontrolle: "+19.75 bp/Tag [-14.20, +61.86] -- Null enthalten"
      replikation: "frueher -9.33, spaeter +3.73, Verhaeltnis -0.40x -- AUSSERHALB"
      einzelmarkt_pruefung: >-
        -4.99 bis -9.60 bp/Tag, groesste Verschiebung +3.21 bp (ohne AVAX).
        Kein einzelner Markt traegt es.
      die_toetungsbedingung_ist_NICHT_erfuellt: >-
        Vorab festgelegt war: "Faellt das Brutto proportional zum Umschlag, ist
        die Sache erledigt." Es faellt nicht. Die Maut faellt von 7.15 auf 1.44
        bp/Tag (Faktor 5), das Brutto steigt von 5.20 auf 6.72. Der Querschnitt
        traegt Information je ZEIT, nicht je Umschichtung -- das erste Mal in
        diesem Projekt, dass eine Kostenreduktion nicht sofort von einem
        schrumpfenden Brutto aufgefressen wird.
      was_jetzt_bindet: >-
        Die STICHPROBE, nicht die Maut. 442 Umschichtungen statt 2.221 Tagen
        reichen nicht, um 5 bp/Tag von Null zu trennen. Mehr Daten wuerden
        hier helfen, wo sie bei E4V nichts geholfen haetten.
      und_es_hilft_nichts: >-
        +5.33 bp/Tag fuer echt genommen ergibt (1.000533)^182 = 1.102x, also
        1.000 -> 1.102 CHF ueber das Zielfenster. Das Ziel verlangt 20.000.
        Faktor 180.
      nicht_entscheidbar: >-
        Aus dem Intervall rueckgerechnet: 77.6 bp Streuung je Umschichtung
        gegen einen Effekt von 5.33 bp, also ein Verhaeltnis von 0.069 je
        Beobachtung. Noetig waeren 2.333 Umschichtungen = 31.9 Jahre
        Kalenderzeit (oder 814 = 11.1 Jahre bei einem unkorrigierten
        95-%-Intervall). Vorhanden: 442 = 6.1 Jahre. Binance-USDT-Perps gibt
        es seit 2019, also sieben Jahre. E4W ist damit nicht "noch
        unentschieden", sondern auf diesem Horizont NICHT ENTSCHEIDBAR -- und
        mehr Symbole helfen nicht, weil zwoelf korrelierte Maerkte in
        derselben Woche eine Beobachtung sind und nicht zwoelf. Was fehlt, ist
        Zeit.
      nicht_behauptet: >-
        Dass Momentum auf fuenf Tagen funktioniert. Das Intervall enthaelt die
        Null, das Vorzeichen kippt zwischen den Fenstern, und derselbe
        Querschnitt hatte auf einem Tag das umgekehrte Vorzeichen. BEIDE
        Vorzeichen waren vorab angemeldet, damit genau diese Versuchung nicht
        greift.
    frage: >-
      E4V hat gemessen: Brutto 5.20 bp/Tag gegen eine Maut von 7.15 bp/Tag bei
      taeglicher Umschichtung. Der Bericht hat ausdruecklich notiert, was die
      Arithmetik NICHT ausschliesst: "ein Signal mit deutlich groesserem
      Brutto oder deutlich kleinerem Umschlag". Der Umschlag ist die Seite,
      die sich ohne neue Daten aendern laesst: bei woechentlicher
      Umschichtung faellt die Maut auf etwa ein Fuenftel.
    warum_ein_eigener_arm: >-
      E4V hat vorab festgelegt "Haltedauer 1 Tag, taegliche Umschichtung. Kein
      zweiter Horizont in diesem Schirm." Dieser Horizont ist deshalb ein
      neuer Vergleich und wird angemeldet, nicht nachgeschoben.
    beide_vorzeichen_angemeldet: >-
      E4V hat das Vorzeichen vorab auf Reversion festgelegt und verloren. Es
      jetzt auf Momentum zu drehen waere genau der Fehler, gegen den die
      Vorabregistrierung existiert. Darum laufen BEIDE Vorzeichen als eigene
      Zellen, und keines wird nach dem Ergebnis gewaehlt. Taegliche Reversion
      und woechentliches Momentum sind verschiedene Phaenomene; welches
      Vorzeichen auf diesem Horizont traegt, weiss ich nicht.
    arms:
      - id: E4W.1
        name: "Residual-Reversion ueber 5 Tage, 5 Tage gehalten"
      - id: E4W.2
        name: "Residual-Momentum ueber 5 Tage, 5 Tage gehalten"
      - id: E4W.3
        name: "Gleichgewichtet halten, gleiche Umschichtungstakt"
        role: "Kontrolle"
    methode: >-
      Wie E4V, mit einem Unterschied: das Residuum wird ueber ein Fenster von
      5 Handelstagen summiert, und umgeschichtet wird alle 5 Tage. Faktor
      weiterhin kausal (Querschnittsmittel desselben Tages), Beta aus einem
      rueckwaertigen 60-Tage-Fenster, das am Stichtag endet. Kosten auf dem
      gemessenen Umschlag, Funding je gehaltener Position.
    metric: "Netto-Rendite je Tag, mit Block-Bootstrap-Intervall"
    comparisons: 3
    acceptance: >-
      Korrigiertes Intervall ohne Null auf Niveau 0.05/55 UND Replikation
      0.5-2.0x. Zusaetzlich zwingend, wie bei E4V: jeden Markt einmal
      auslassen -- das Ergebnis darf nicht an einem haengen.
    vorab_festgelegt:
      - >-
        Derselbe Ueberlebenden-Satz wie E4V, also dieselbe Einschraenkung: ein
        POSITIVES Ergebnis ist kein Befund, sondern die Rechtfertigung fuer
        den Kursdownload eines Punkt-in-Zeit-Universums.
      - >-
        Faellt das Brutto proportional zum Umschlag, ist die Sache erledigt --
        dann traegt der Querschnitt eine Information je Umschichtung und nicht
        je Zeit, und kein Horizont rettet sie.
      - "Fenster und Takt stehen auf 5 Tagen und werden nicht variiert."
      - >-
        Die frueheren Arme mom_7/mom_30/vol_30 werden NICHT wiederbelebt. Der
        Unterschied bleibt die Faktorbereinigung und der dollar-neutrale
        Querschnitt.

