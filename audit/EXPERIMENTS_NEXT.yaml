      Der Lauf ist teuer: 12 Maerkte x 3 Regeln, je ein voller Motorlauf,
      grob 18 Stunden. Er wartet, bis der Backfill die Maschine freigibt.
    instrument_vor_dem_lauf: >-
      14.10.2026, 17:1x UTC, Commit 22d9242 -- GESTARTET. Und davor am
      Instrument gearbeitet, was hier stehen muss, weil es sonst wie eine
      Anpassung nach dem Ergebnis aussieht.

      `scripts/compare_exits.py` rechnete Mittelwert und 95%-Standardfehler.
