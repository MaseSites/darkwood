experiments:

  - id: E0
    title: "Ausfuehrungskosten und Signaluebertragung"
    priority: 1
    status: registriert
    rationale: >-
      Die Aussage "keine Gebuehrensenkung kann das Vorzeichen drehen" war eine
      Verallgemeinerung von einer Venue auf alle. An den Primaerquellen geprueft
      (07.10.2026): Lighter Standard 0%/0%, Lighter Premium 0.0040%/0.0280%,
      Extended 0.000%/0.025%. Lighter Premium maker/maker mit 0.0080% liegt
      unter der Obergrenze des gemessenen Einstiegsvorsprungs (0.0106%).
      Damit verschiebt sich die Frage von der Gebuehr auf Spread, Latenz und
      adverse Selektion -- drei Groessen, die dieses Projekt nie gemessen hat.
    hypothesis: >-
      Der gemessene 5-Minuten-Vorsprung ueberlebt eine realistische Ausfuehrung
      auf einer Null-Gebuehren-Venue, nachdem Spread, Nicht-Fills, Latenz und
      adverse Selektion abgezogen sind.
    arms:
      - id: E0.1
        name: "Bestehende Venue, Taker/Taker"
        role: Kontrolle
      - id: E0.2
        name: "Bestehende Venue, Maker-Eintritt / Taker-Stop"
      - id: E0.3
        name: "Neue Venue A, Maker/Maker soweit gefuellt"
      - id: E0.4
        name: "Neue Venue A, Taker/Taker"
    comparisons: 4
    data_required:
      - "Quotes, Trades, Funding, Instrumentparameter je Venue, mit lokaler Empfangszeit"
      - "Keine synthetische Uebernahme von Fills einer anderen Venue"
    measurements:
      - "implementation_shortfall = simulierter Fill relativ zum Entscheidungspreis"
      - "all_in_pnl = PnL auf Fill-Preisen minus Gebuehren plus signed Funding"
      - "Nicht-Fills, Teil-Fills, verfallene Signale, Cancel-Verzoegerung"
      - "tatsaechlich verfuegbare Orderbuchgroesse am Fill"
      - "Markouts nach 1s, 5s, 30s, 5min als Diagnose fuer adverse Selektion"
    primary_metric: "erwarteter Netto-PnL pro SIGNAL und pro Zeiteinheit"
    progress:
      stand: 2026-10-07
      schritt_1_kosten:
        status: gemessen
        bericht: "audit/VENUE_KOSTEN_REPORT.md Abschnitt 2-4"
        skript: "scripts/study_venue_cost.py"
        ergebnis: >-
          Gebuehren aus den Instrumentdaten der Boerse selbst (0%/0% auf sechs
          Maerkten) und buchgelaufene effektive Kosten. Taker/Taker-Runde ueber
          1000 USD auf BTC: 0.0005%, also 22x UNTER der Obergrenze des
          gemessenen Einstiegsvorsprungs (0.0106%). Auf XRP, LINK und DOGE
          liegt sie darueber.
      schritt_2_nichtfills:
        status: "teilweise gemessen"
        bericht: "audit/VENUE_KOSTEN_REPORT.md Abschnitt 6b"
        skript: "scripts/study_venue_fills.py"
        gemessen:
          - "Storno-Anteil je ~17s: 9.49% (LINK) bis 49.19% (ETH) -- verschwunden OHNE dass der Preis die Order erreicht hat"
          - "tatsaechlich verfuegbare Antrittsgroesse, beide Seiten"
          - "Warteschlange am Antritt fuer 1000 USD: 5.9% (ETH) bis 200.3% (XRP)"
        nicht_gemessen:
          - "Teil-Fills als BELEGTE Ereignisse. Dieses Buch kann ohne Trade-Tape keinen Fill belegen: 33 von 41 Verkleinerungen lagen an nie erreichten Preisen."
          - "Markouts. Ohne belegte Fills gibt es nichts, worauf bedingt werden koennte. Die unbedingte Mid-Bewegung ist KEIN Markout und wird nicht als einer berichtet."
          - "Cancel-VERZOEGERUNG (dokumentiert 300ms, nicht gemessen)"
          - "verfallene Signale"
          - "Horizonte 1s, 5s und 5min -- brauchen Streaming bzw. eine laengere Aufnahme"
        grenze_der_aufnahme: >-
          Fuenf Buch-Aufnahmen je Markt, 17.3s Abstand, ~69s Gesamtspanne, ein
          Vormittag, kein Stress, kein Trade-Tape. Belegt ist die MESSUNG, nicht
          eine Charakterisierung dieser Venue.
      schritte_3_bis_7:
        status: offen
        blockiert_durch: trade_tape_new_venue
        hinweis: >-
          Die Freigabebedingung dieses Experiments ist weder erfuellt noch
          verfehlt -- sie ist nicht geprueft. Kein Arm (E0.1 bis E0.4) wurde
          bisher gerechnet; Schritt 1 und 2 messen die Vorbedingungen.
    pitfalls_declared:
      - "Spread nicht doppelt abziehen, wenn bid/ask-Fills ihn schon enthalten"
      - "Markouts sind Diagnose, keine zusaetzliche PnL-Gebuehr"
      - "Maker-Status ist eine Fill-Eigenschaft, kein Wunsch des Strategen"
      - "0 ms dokumentierte Zusatzverzoegerung ist keine netzwerkfreie Ausfuehrung"
    acceptance: >-
      Positiver, auf 46 Vergleiche korrigierter Nettoeffekt im
      Entwicklungsfenster UND absolute Profitabilitaet. Eine Wirkung, die nur
      aus dem Gebuehrenrabatt stammt, zaehlt nicht als Signalvorteil. Neue
      Venue-Historie darf kurz sein; ein langes Binance-Fenster verlaengert sie
      nicht.
    blocks: ["E5"]

  - id: E1
    title: "Meta-Labeling bestehender Signale"
    priority: 1
    status: gelaufen_gefallen
    ergebnis_nachgetragen_21_10_2026: >-
      Gelaufen vor dem 15.10. (audit/E7_BUDGETVORSCHLAG.md Abschnitt 2,
      audit/PROBLEMBERICHT_20X.md P5), der Status hier stand bis heute auf
      "registriert". Nachgetragen, damit "alle Merkmale mit einem Modell
      verbinden" nicht erneut als neue Idee auftaucht. 42'849 gelabelte
      Kandidaten: E1.4 logistische Regression -0.1024 R [-0.1715; -0.0412],
      E1.5 flaches LightGBM -0.0673 R [-0.1511; +0.0324], Zufallsfilter
      gleicher Selektivitaet -0.1328 R. Beide schlagen den Zufall, keiner ist
      absolut positiv: Tor (a) gefallen. Es gibt Auswahlsignal, aber es
      verdient nichts.
    rationale: >-
      Der Satz "eine Auswahl im negativen Pool kann nichts beitragen" ist am
      07.10.2026 an den eigenen Daten widerlegt (audit/RECHERCHE_KORREKTUREN.md
      3.1): Pool -0.0906 R, Teilmenge rating_band=eindeutig +0.0311 R auf 588
      Trades, und das Merkmal steht vor dem Trade fest. Das Intervall umspannt
      die Null, gegen einen Zufallsfilter gleicher Selektivitaet liegt es knapp
      darueber. Also ein Kandidat, kein Ergebnis.
    hypothesis: >-
      Merkmale, die zum Entscheidungszeitpunkt bekannt sind, trennen auf NEUEN
      Daten eine Teilmenge mit positivem Netto-R aus dem gueltigen Pool.
    population: >-
      Alle ex ante gueltigen Kandidaten, genommene UND abgelehnte. Abgelehnte
      werden hypothetisch gelabelt und bleiben Counterfactuals -- sie zaehlen
      nicht als echte Fills. Sicherheitsablehnungen (Liquidationsverletzung)
      werden NICHT ueberstimmt.
    arms:
      - id: E1.1
        name: "Ungefilterter gueltiger Pool"
        role: Basis
      - id: E1.2
        name: "Vorhandener FakeBrain-/Kostenfilter"
        role: Basis
      - id: E1.3
        name: "Zufallsfilter gleicher ex-ante-Selektivitaet"
        role: Kontrolle
      - id: E1.4
        name: "Regularisierte logistische Regression"
      - id: E1.5
        name: "Flaches LightGBM, Komplexitaet vorab fixiert"
        fixed_params:
          num_leaves: 15
          max_depth: 4
          min_child_samples: 60
          n_estimators: 200
          learning_rate: 0.05
          reg_lambda: 2.0
    comparisons: 10
    features_allowed:
      - setup_key
      - setup_timeframe
      - rating_band
      - regime
      - side
      - "ATR-relative Struktur zum Entscheidungszeitpunkt"
      - "geschaetzte Kosten und Spread"
      - "Tageszeit und Wochentag"
      - "Signalalter in Kerzen"
      - "BTC-Exposure des Portfolios"
      - "Funding / OI / Flow, nur wo Herkunft geklaert ist"
    features_forbidden:
      - "tatsaechliche Haltezeit"
      - "max_favourable_r / max_adverse_r"
      - "exit_reason"
      - "realisiertes R oder irgendein Nachher-Label als Eingabe"
    targets:
      - "Wahrscheinlichkeit eines positiven NETTO-Trades im festgelegten Exit-Schema"
      - "erwartetes Netto-R"
      - "Verlustquantil (5%)"
    decision_rule: >-
      E[R_net | x] > 0 inklusive Unsicherheit. Trefferquote ist allein kein
      oekonomisches Kriterium. Zusaetzlich E[ln(1+f*R_net) | x], sofern die
      Verteilung das stuetzt.
    calibration: >-
      Nur auf einem zeitlich NACHGELAGERTEN, purged Calibration-Fenster.
      Sigmoid zuerst; Isotonic nur bei ausreichender Belegung, weil es bei
      duenner Datenlage ueberfittet. Brier-Score, Log-Loss und
      Reliability-Diagramm mit Gruppenbelegung.
    threshold: >-
      Im inneren Entwicklungsfenster gewaehlt und dann EINGEFROREN. Weitere
      Schwellen sind angemeldete Sensitivitaeten und zaehlen in `comparisons`.
    acceptance: >-
      (a) absoluter Netto-Vorteil positiv, (b) Mehrwert gegenueber E1.3 bei
      gleicher Selektivitaet, (c) ausreichende Wochenblock-Evidenz, (d) Effekt
      haelt im Bestaetigungsfenster. Zusaetzlich ein vollstaendiger kausaler
      Portfolio-Replay: ein ausgelassener Trade veraendert spaetere freie
      Slots, was eine reine Signalstudie nicht sieht.
    on_success: "erster Kandidat fuer einen neuen Paper-Champion"

  - id: E2
    title: "Oekonomische Vorhersage mit Handels-/Haltezone"
    priority: 1
    status: registriert
    rationale: >-
      Der vorhandene Filter "Kosten relativ zum Stoprisiko" ist etwas anderes
      als "erwarteter Gewinn rechtfertigt einen Positionswechsel". Eine
      bestehende Position zu HALTEN kostet keinen Round-trip.
    hypothesis: >-
      Eine kostenbewusste Long/Flat/Hold-Entscheidung mit Hysterese schlaegt die
      naive Vorzeichenentscheidung desselben Forecasts, netto.
    scope:
      timeframe: H1
      markets: [BTCUSDT, ETHUSDT]
      features: "bestehende kompakte Featureliste, unveraendert"
    arms:
      - id: E2.1
        name: "Lineare Regression, naive Vorzeichenentscheidung"
        role: Basis
      - id: E2.2
        name: "Lineare Regression, kostenbewusste Zone mit Hysterese"
      - id: E2.3
        name: "XGBoost, naive Vorzeichenentscheidung"
        role: Basis
      - id: E2.4
        name: "XGBoost, kostenbewusste Zone mit Hysterese"
      - id: E2.5
        name: "Passives risikovergleichbares Exposure"
        role: Kontrolle
    comparisons: 8
    hysteresis:
      primary_threshold: "1.5 x geschaetzte zusaetzliche Kosten des Wechsels"
      sensitivities: [1.0, 2.0, 3.0]
      note: "Die Hauptschwelle ist hier festgelegt; die drei anderen zaehlen mit."
    pitfalls_declared:
      - "Nur ZUSAETZLICHE Kosten einer Positionsaenderung ansetzen, nicht jede Kerze einen Round-trip"
      - "Lange und kurze Exposures haben verschiedene Funding-Pfade"
      - "Optimiert wird auf Nettoleistung im inneren Fenster, nicht auf Test-Accuracy oder Test-Sharpe"
    acceptance: >-
      Vorteil gegen denselben ungefilterten Forecast UND absolute
      Nettoleistung, zusaetzlich getrennte Beurteilung gegen E2.5.
    reference: "Q18 liefert den Replikationsansatz, keinen Beweis."

  - id: E3
    title: "Ausgaenge als kausale Handelspolitik"
    priority: 2
    status: erledigt_negativ
    result:
      stand: 2026-10-07
      bericht: audit/E3_AUSGAENGE.md
      skript: scripts/study_exits.py
      faelle: 7255
      maerkte: 12
      gepaart: >-
        Jeder Arm auf DENSELBEN Einstiegen, verglichen als gepaarte Differenz
        je Trade. Unverbunden wuerde der Vergleich die Streuung der Einstiege
        mitmessen, die beide Arme gemeinsam haben -- und die ist um
        Groessenordnungen groesser als der gesuchte Effekt.
      arme:
        E3.1_stop_und_ziel: "-0.0205 R, 14.4h gehalten (Basis)"
        E3.2_stop_und_24h: "-0.0824 R, gepaart -0.0619 [-0.1316, +0.0071] -- unentschieden, Richtung negativ"
        E3.3_trail_2atr: "-0.0762 R, gepaart -0.0557 [-0.1123, -0.0060] -- ZUVERLAESSIG SCHLECHTER"
      warum: >-
        Das Ziel arbeitet: 31.1% der Trades verlassen darueber. Beide
        Alternativen nehmen diese Tuer weg und schneiden den Gewinner
        frueher ab -- die Haltezeit faellt bei E3.3 von 14.4 auf 7.9h, der
        Trail greift in 99% der Faelle. Ein Trailing-Stop, der fast immer
        zuerst greift, ist kein Gewinnschutz, sondern ein engerer Stop mit
        mehr Schritten.
      population: >-
        ANDERE als in E1, mit Absicht. E1 filtert nur `liquidation` und
        behaelt die von Kosten- und Chance-Risiko-Regel abgelehnten Signale.
        E3 nimmt nur, was das System TATSAECHLICH handelt -- eine
        Ausstiegspolitik gilt nur fuer eine Position, die es gibt. Auf BTC
        bleiben 203 von 2552 Signalen. Die Fallzahlen von E1 und E3 sind
        NICHT vergleichbar.
      urteil: >-
        NICHT BELEGT. Kein Arm absolut positiv, kein gepaarter Mehrwert --
        und E3.3 verfehlt die Abnahme in die GEGENRICHTUNG.
      und_umgekehrt: >-
        Die BESTEHENDE Ausstiegspolitik ist messbar besser als beide
        Alternativen, bei E3.3 mit Intervall ohne Null. Das ist das erste
        Mal in diesem Projekt, dass etwas, das das System schon tut, gegen
        eine benannte Alternative verteidigt werden kann statt nur nicht
        widerlegt zu sein. Es macht das System nicht profitabel; es
        schliesst eine Richtung, in die zu optimieren waere.
      nicht_nachjustiert: >-
        Die 2.0 ATR standen vorab fest. Ein anderer Trail-Abstand koennte
        besser abschneiden; ihn nach dem Ergebnis zu suchen waere genau der
        Griff, den der Auftrag verbietet. Die Zerlegung sagt ohnehin, woran
        es liegt: nicht am Abstand, sondern daran, dass der Trail die
        Ziel-Tuer ersetzt.
    depends_on: [E0]
    rationale: >-
      Am 07.10.2026 gemessen (scripts/study_stop_path.py): ein Stop 1.5x so weit
      haette 70.1% der heute ausgestoppten Trades nicht beendet, 94.2% waren
      vorher im Plus. Die Annahme "gleicher Pfad" ist fuer die Mehrheit der
      Trades falsch, also ist eine Exit-Studie zulaessig.
    hypothesis: >-
      Eine andere Exit-Politik auf denselben Entries verbessert Netto-R und
      Log-Wachstum, nicht nur das mittlere R.
    fixed: "Entry-Set bleibt unveraendert. Nur der Ausgang variiert."
    arms:
      - id: E3.1
        name: "Bisheriger Stop und TP"
        role: Basis
      - id: E3.2
        name: "Bisheriger Stop mit festem Zeitausstieg (24h)"
      - id: E3.3
        name: "ATR-Trailing-Exit, Parameter vorab festgelegt (2.0 ATR)"
    comparisons: 3
