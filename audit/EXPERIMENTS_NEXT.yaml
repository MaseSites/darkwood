  - id: E7
    title: "LLM-Urteil als Shadow-Studie"
    priority: 3
    status: registriert
    note: >-
      Vom Auftrag in Abschnitt 9 verlangt, hier als eigener Arm gefuehrt, damit
      er in `total_comparisons` zaehlt. Darf parallel laufen und muss nicht
      warten, bis der Signalpool positiv ist -- E1 bleibt der guenstigere erste
      Selektionsmassstab.
    fixed: "Entry, Stop und TP bleiben identisch. Beurteilt wird nur Annahme/Ablehnung."
    arms:
      - id: E7.1
        name: "Kein Urteil"
        role: Basis
      - id: E7.2
        name: "FakeBrain, arithmetisch"
        role: Basis
      - id: E7.3
        name: "Kalibriertes kleines ML-Modell aus E1"
      - id: E7.4
        name: "Echtes Claude-Urteil, Prompt/Schema/Modell eingefroren"
    comparisons: 6
    store_before_outcome:
      - factor_scores
      - raw_confidence
      - decision
      - prompt_hash
      - schema_hash
      - returned_model_id
      - api_cost
      - latency
    primary_metric: "Netto-R je ex-ante-Kandidat, auf identischer Kandidatenmenge"
    acceptance: >-
      Das Urteil muss (a) E7.2 (FakeBrain, arithmetisch und kostenlos) auf
      derselben Kandidatenmenge schlagen -- nicht den ungefilterten Pool, denn
      FakeBrain ist der guenstigere Massstab -- und (b) absolut netto positiv
      sein. Replay und Forward-Shadow werden getrennt bewertet und nie
      gemittelt. Kosten und Latenz der API zaehlen in die Nettorechnung, weil
      sie bei 1'000 CHF Kapital materiell sind. Schlaegt E7.4 nur den
      ungefilterten Pool und nicht FakeBrain, ist das Ergebnis "das Urteil
      traegt nichts, was Arithmetik nicht auch traegt" -- und wird so berichtet.
    pitfalls_declared:
      - "Eine gewichtete Faktorsumme ist keine kalibrierte Gewinnwahrscheinlichkeit"
      - "Modell-IDs ueber die offizielle Models-API pruefen, nicht aus dem Namensschema ableiten"
      - "Der Cache reproduziert gespeicherte Antworten, garantiert keine identische neue"
      - "Replay und Forward-Shadow strikt getrennt"
      - "Keine autonome Prompt-Anpassung in einem Bestaetigungsfenster; neuer Prompt = neuer Arm"
      - >-
        Datums- und Symbolentfernung senkt die historische Wiedererkennung,
        beweist aber nicht deren Unmoeglichkeit. News mit historischem Datum
        bevorzugt vorwaerts testen.

