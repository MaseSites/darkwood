      E12_3_minute: >-
        NICHT ENTSCHEIDBAR, und auf dem alten Lauf prinzipiell nicht messbar.
        Nur M15-Population: :00 n=500 -0.0141 R, auf 15/30/45 n=2 +1.0259 R,
        40 weitere zu beliebigen Minuten als Limit-Fills ausgeschlossen.
        KORREKTUR der ersten Fassung: sie gruppierte gegen "nicht :00" und
        bekam 42 Faelle bei -0.1283 R, von denen 40 Limit-Fills waren. Der
        Einstiegszeitstempel ist die Fuellung, nicht die Entscheidung.
        Richtig gruppiert kippt das Vorzeichen. Ohne die vorab festgelegte
