# Quellen- und Datenmanifest
#
# Angelegt am 07.10.2026. Verlangt von TRADING_BRAIN_CLAUDE_RECHERCHE_UND_
# UMBAUPROMPT.md, Lieferung 2: "Venue, Zugriff, Retention, Rechte, Zeitsemantik,
# Coverage und Kosten".
#
# Kennzeichnung je Eintrag:
#   verified_here  -- in diesem Projekt an der Quelle nachgemessen, mit Datum
#                     und Skript. Das ist die einzige Stufe, auf der eine Zahl
#                     ein Modell trainieren darf.
#   documented     -- aus der Primaerdokumentation der Quelle gelesen, nicht
#                     nachgemessen.
#   assumed        -- Annahme dieses Projekts. Steht hier, damit sie nicht als
#                     Tatsache weiterwandert.
#   unknown        -- offen. Keine Zahl darauf stuetzen.
#
# Die Regel, die alles hier traegt: `available_at <= decision_time`. Eine
# pauschale Quellenverzoegerung ersetzt keine Revisionshistorie.

meta:
  created: 2026-10-07
  commit: 9af96c7
  licence_rule: >-
    Oeffentlich herunterladbar ist nicht gleich uneingeschraenkt
    weiterverteilbar. Bei unklarer Lizenz werden Daten nicht veroeffentlicht
    und nicht in den Wissens-Vault kopiert. Dieses Manifest haelt fuer jede
    Quelle fest, was dazu bekannt ist -- und wo nichts bekannt ist, steht
    `unknown` und nicht eine Vermutung.

# ---------------------------------------------------------------------------
# Das Datenmodell, das jede neue Quelle fuellen muss. Aus Abschnitt 6 des
# Auftrags uebernommen und hier verbindlich.

minimal_schema:
  identity: [venue, product, symbol, contract_multiplier, quote_currency]
  time:
    - event_time_utc        # wann es am Markt passierte
    - received_at_utc       # wann wir es lokal empfangen haben
    - published_at_utc      # wann die Quelle es veroeffentlicht hat
    - available_at_utc      # ab wann eine Entscheidung es kennen DURFTE
  provenance: [source_version, revision_id, provenance, data_quality_flags]
  book: [bid, ask, bid_size, ask_size, trade_price, trade_size, aggressor_side]
  funding:
    - funding_rate_announced   # prognostiziert, vor der Abrechnung bekannt
    - funding_rate_realized    # abgerechnet
    - funding_settlement_time
  derivatives: [oi_value, oi_unit, interval_start, interval_end]
  note: >-
    `funding_rate_announced` und `funding_rate_realized` sind GETRENNT zu
    speichern. Die historische abgerechnete Rate ist vor ihrer Abrechnung nicht
    bekannt; sie als Merkmal zum Entscheidungszeitpunkt zu verwenden ist ein
    Leck. Heute speichert dieses Projekt nur eine Spalte `rate` -- offen.

# ---------------------------------------------------------------------------

