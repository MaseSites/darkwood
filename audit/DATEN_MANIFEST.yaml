wanted:

  - name: spot_series_same_venue
    priority: 1
    enables: >-
      Basisrisiko des Carry-Trades messbar machen. Heute ist auf der Platte nur
      der Perp, also ist JEDE Carry-Zahl eine Obergrenze und keine Schaetzung.
    does_not_enable: "Eine externe Durchschnittszahl ersetzt die Same-Venue-Reihe nicht."
    source: "Oeffentliches Spot-Archiv derselben Venue"
    cost: 0
    time_trap: >-
      Das Spot-Archiv weist ab 01.01.2025 MIKROSEKUNDEN-Zeitstempel aus. Der
      Wechsel ist explizit zu pruefen -- eine zweite Zeitfalle neben dem
      bekannten pandas-Problem (`.dt.as_unit("ms")` ist Pflicht).

  - name: l2_orderbook
    priority: 1
    enables: "Queue-, Spread- und Flow-Studien (E5). Schaltet die einzige 'nicht testbar'-Familie frei."
    does_not_enable: >-
      Ein STUENDLICHER Snapshot reicht nicht fuer realistische Maker-Fills
      ZWISCHEN den Snapshots. Dafuer braucht es initiales Buch plus
      lueckenlose Updates und Trades. `bookDepth`-Aggregate sind nicht
      automatisch rekonstruierbare vollstaendige L2-Events.
    source: "Eigener WebSocket-Collector mit Reconnect- und Luecken-Pruefung"
    cost: 0
    note: "Monats-Samples eines Anbieters reichen fuer Diagnose, nicht fuer kontinuierlichen PnL."

  - name: trade_tape_new_venue
    priority: 1
    enables: >-
      Den EINZIGEN Weg, in diesem Buch eine Teilausfuehrung von einer
      Teil-Storno zu trennen -- und damit jeden Markout und jede Aussage
      ueber adverse Selektion.
    blocks: ["E0 Punkt 3", "E0 Punkt 7 (Teil-Fills)", E5]
    source: "Derselbe Collector wie l2_orderbook, Trades zusaetzlich zu Quotes"
    cost: 0
    measured_here: >-
      Gemessen 07.10.2026 mit scripts/study_venue_fills.py auf fuenf
      Buch-Aufnahmen je Markt im Abstand von 17.3s. Das Buch ist
      ORDER-AUFGELOEST (order_id, order_index, remaining_base_amount),
      also laesst sich dieselbe Order verfolgen. Daraus sind ohne eigene
      Order ablesbar: Storno-Anteil (9.49% LINK bis 49.19% ETH je ~17s,
      verschwunden OHNE dass der Preis die Order erreicht hat),
      verfuegbare Antrittsgroesse und die Warteschlange.
    does_not_enable: >-
      EINEN BELEGTEN FILL. Eine schrumpfende remaining_base_amount kann
      eine Teilausfuehrung sein ODER eine Teil-Storno. Belegt durch den
      Lauf selbst: von 41 Verkleinerungen lagen 33 an Preisen, die der
      Markt im Fenster nie erreicht hat -- eine davon 394 bp vom Mid, und
      ein Ask 4% ueber dem Markt wird in 17 Sekunden nicht gehandelt.
      Die Erreichbarkeitspruefung ist eine NOTWENDIGE Bedingung aus den
      Daten, keine erfundene Schwelle, und notwendig ist nicht hinreichend.
    note: >-
      Damit ist die parallele Aufnahme nicht mehr nur gefordert, sondern
      begruendet: ohne Trades gibt es keinen Markout, egal wie lange das
      Buch aufgenommen wird. Offen bleiben ausserdem die Cancel-VERZOEGERUNG
      (dokumentiert 300ms, nicht gemessen) und die Horizonte 1s/5s/5min.

  - name: point_in_time_universe
    priority: 1
    enables: "E4. Behebt Survivorship in jeder marktuebergreifenden Zahl."
    blocks: [E4]
    source: "Archivsymbole und historische Instrumentlisten"
    cost: 0
    note: >-
      Die Richtung des Survivorship-Bias ist fuer einen Long-Arm klar
      (zu optimistisch). Fuer Long/Short, Shortbarkeit und
      Delisting-Abrechnung ist sie NICHT ohne Pruefung festgelegt.

  - name: alfred_vintages
    priority: 2
    enables: "Damals bekannte Makro-Werte statt heute revidierter Historie."
    source: "ALFRED, oeffentliche Downloads"
    cost: 0

  - name: multi_venue_funding
    priority: 2
    enables: "Carry-Spreads (E6.2) statt Vorhersage einer einzelnen Rate."
    note: "Teilweise schon da, aber unbeabsichtigt und gemischt -- siehe funding oben."

  - name: oi_ratio_remaining_markets
    priority: 3
    enables: "Derivate-Familie auf 12 statt 4 Maerkten."
    retention_warning: "API-Rueckblick ist begrenzt. Vollhistorie nur aus Archiven oder kostenpflichtig."

